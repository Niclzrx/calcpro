<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juros Simples - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Financeiras</a> / Juros Simples</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Juros Simples</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="capital">Capital (R$)</label>
          <input type="number" id="capital" step="0.01" placeholder="Ex: 10000" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="taxa">Taxa de Juros (% ao período)</label>
            <input type="number" id="taxa" step="0.01" placeholder="Ex: 2" required>
          </div>
          <div class="form-group">
            <label for="tempo">Tempo (períodos)</label>
            <input type="number" id="tempo" placeholder="Ex: 12" required>
          </div>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var capital = val('capital');
    var taxa = val('taxa') / 100;
    var tempo = val('tempo');

    var juros = capital * taxa * tempo;
    var montante = capital + juros;

    document.getElementById('valorResultado').textContent = 'Juros: ' + fmtCurrency(juros);
    document.getElementById('detalheResultado').innerHTML =
      'Fórmula: I = C × r × t<br>' +
      'I = ' + fmtCurrency(capital) + ' × ' + fmtPercent(val('taxa')) + ' × ' + tempo + '<br>' +
      'Juros: ' + fmtCurrency(juros) + '<br>' +
      'Montante: ' + fmtCurrency(montante);
    showResult('resultado');
    return false;
  }
  </script>
</body>
</html>
