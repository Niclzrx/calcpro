<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financiamento de Automóveis - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Financeiras</a> / Financiamento de Automóveis</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Financiamento de Automóveis</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="valorCarro">Valor do Carro</label>
          <input type="number" id="valorCarro" placeholder="Ex: 80000" required>
        </div>
        <div class="form-group">
          <label for="entrada">Valor da Entrada</label>
          <input type="number" id="entrada" placeholder="Ex: 15000" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="taxaJuros">Taxa de Juros Anual (%)</label>
            <input type="number" id="taxaJuros" step="0.01" placeholder="Ex: 15" required>
          </div>
          <div class="form-group">
            <label for="prazoMeses">Prazo (meses)</label>
            <input type="number" id="prazoMeses" placeholder="Ex: 48" required>
          </div>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var carro = val('valorCarro');
    var entrada = val('entrada');
    var taxaAnual = val('taxaJuros') / 100;
    var meses = val('prazoMeses');
    var principal = carro - entrada;
    var taxaMensal = taxaAnual / 12;
    var parcela = calcAmortization(principal, taxaMensal, meses);
    var totalPago = parcela * meses;
    var totalJuros = totalPago - principal;
    document.getElementById('valorResultado').textContent = 'Parcela Mensal: ' + fmtCurrency(parcela);
    document.getElementById('detalheResultado').innerHTML =
      'Total Pago: ' + fmtCurrency(totalPago) + '<br>' +
      'Juros Totais: ' + fmtCurrency(totalJuros) + '<br>' +
      'Valor Financiado: ' + fmtCurrency(principal);
    showResult('resultado');
    return false;
  }
  </script>
</body>
</html>
