<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Hipotecas Canadense - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Financeiras</a> / Hipotecas Canadense</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Hipotecas Canadense</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="valorPropriedade">Valor da Propriedade (C$)</label>
          <input type="number" id="valorPropriedade" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="entrada">Entrada (C$)</label>
          <input type="number" id="entrada" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="taxaJuros">Taxa de Juros Anual (%)</label>
          <input type="number" id="taxaJuros" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="amortizacao">Amortização (anos)</label>
          <input type="number" id="amortizacao" required>
        </div>
        <div class="form-group">
          <label for="prazo">Prazo (anos)</label>
          <input type="number" id="prazo" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>&copy; 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var valorPropriedade = parseFloat(document.getElementById('valorPropriedade').value);
    var entrada = parseFloat(document.getElementById('entrada').value);
    var taxaAnual = parseFloat(document.getElementById('taxaJuros').value) / 100;
    var amortizacao = parseInt(document.getElementById('amortizacao').value);
    var prazo = parseInt(document.getElementById('prazo').value);

    var emprestimo = valorPropriedade - entrada;

    // Canadian mortgage uses semi-annual compounding
    var taxaSemestral = taxaAnual / 2;
    var taxaMensal = Math.pow(1 + taxaSemestral, 1/6) - 1;
    var numeroParcelas = amortizacao * 12;
    var pagamentoMensal;

    if (taxaMensal === 0) {
      pagamentoMensal = emprestimo / numeroParcelas;
    } else {
      pagamentoMensal = emprestimo * (taxaMensal * Math.pow(1 + taxaMensal, numeroParcelas)) /
        (Math.pow(1 + taxaMensal, numeroParcelas) - 1);
    }

    var totalPago = pagamentoMensal * numeroParcelas;
    var totalJuros = totalPago - emprestimo;

    // Remaining balance after term
    var saldoRestante = emprestimo;
    var parcelasTermo = prazo * 12;
    for (var i = 0; i < parcelasTermo; i++) {
      var jurosMes = saldoRestante * taxaMensal;
      var principalMes = pagamentoMensal - jurosMes;
      saldoRestante -= principalMes;
    }

    document.getElementById('valorResultado').innerHTML =
      'Pagamento Mensal: C$ ' + pagamentoMensal.toFixed(2);
    document.getElementById('detalheResultado').innerHTML =
      'Valor do Empréstimo: C$ ' + emprestimo.toFixed(2) +
      '<br>Total de Juros: C$ ' + totalJuros.toFixed(2) +
      '<br>Total Pago: C$ ' + totalPago.toFixed(2) +
      '<br>Saldo Restante após ' + prazo + ' anos: C$ ' + Math.max(0, saldoRestante).toFixed(2);

    return false;
  }
  </script>
</body>
</html>
