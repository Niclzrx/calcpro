<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Depreciação - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Financeiras</a> / Depreciação</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Depreciação</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="valorOriginal">Valor Original do Ativo (R$)</label>
          <input type="number" id="valorOriginal" step="0.01" placeholder="Ex: 100000" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="vidaUtil">Vida Útil (anos)</label>
            <input type="number" id="vidaUtil" placeholder="Ex: 10" required>
          </div>
          <div class="form-group">
            <label for="metodo">Método</label>
            <select id="metodo">
              <option value="linear">Linear (Retas)</option>
              <option value="saldodecrescente">Saldo Decrescente (Diminuir)</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var valor = val('valorOriginal');
    var vida = val('vidaUtil');
    var metodo = document.getElementById('metodo').value;
    if (valor <= 0) { alert('Informe um valor válido.'); return false; }
    if (vida <= 0) { alert('Vida útil deve ser maior que 0.'); return false; }
    var depreciacaoAnual = valor / vida;
    var depreciacaoMensal = depreciacaoAnual / 12;
    var detalhes = '';
    if (metodo === 'linear') {
      detalhes = 'Método Linear<br>' +
        'Depreciação Anual: ' + fmtCurrency(depreciacaoAnual) + '<br>' +
        'Depreciação Mensal: ' + fmtCurrency(depreciacaoMensal) + '<br><br>' +
        '<strong>Cronograma Anual:</strong><br>';
      var saldo = valor;
      for (var i = 1; i <= vida; i++) {
        saldo -= depreciacaoAnual;
        detalhes += 'Ano ' + i + ': Depreciação ' + fmtCurrency(depreciacaoAnual) +
          ' | Saldo: ' + fmtCurrency(Math.max(saldo, 0)) + '<br>';
      }
    } else {
      detalhes = 'Método Saldo Decrescente<br>' +
        'Taxa de Depreciação: ' + fmtPercent(200 / vida) + '<br><br>' +
        '<strong>Cronograma Anual:</strong><br>';
      var saldo = valor;
      var taxa = 2 / vida;
      for (var i = 1; i <= vida; i++) {
        var dep = saldo * taxa;
        saldo -= dep;
        detalhes += 'Ano ' + i + ': Depreciação ' + fmtCurrency(dep) +
          ' | Saldo: ' + fmtCurrency(Math.max(saldo, 0)) + '<br>';
      }
    }
    document.getElementById('valorResultado').textContent = fmtCurrency(depreciacaoAnual) + '/ano';
    document.getElementById('detalheResultado').innerHTML = detalhes;
    showResult('resultado');
    return false;
  }
  </script>
</body>
</html>
