<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Salários - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Financeiras</a> / Salários</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Salários</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label>Salário Bruto (R$)</label>
          <input type="number" id="salario" step="0.01" placeholder="Ex: 5000">
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const salarioBruto = val('salario');
    if (salarioBruto <= 0) { alert('Informe o salário bruto.'); return false; }

    // INSS 2024 - faixas progressivas
    const inssFaixas = [
      { ate: 1412.00, aliquota: 7.5 },
      { ate: 2666.68, aliquota: 9 },
      { ate: 4000.03, aliquota: 12 },
      { ate: 7786.02, aliquota: 14 },
      { ate: Infinity, aliquota: 14 }
    ];

    let inss = 0;
    let salarioRestante = salarioBruto;
    let faixaAnterior = 0;

    for (const faixa of inssFaixas) {
      const baseFaixa = Math.min(salarioRestante, faixa.ate - faixaAnterior);
      if (baseFaixa <= 0) break;
      inss += baseFaixa * faixa.aliquota / 100;
      salarioRestante -= baseFaixa;
      faixaAnterior = faixa.ate;
    }

    // Teto INSS
    inss = Math.min(inss, 951.63);

    // Base para IRRF
    const baseIRR = salarioBruto - inss;

    // IRRF 2024
    const irrfFaixas = [
      { ate: 2259.20, aliquota: 0, parcela: 0 },
      { ate: 2826.65, aliquota: 7.5, parcela: 169.44 },
      { ate: 3751.05, aliquota: 15, parcela: 381.44 },
      { ate: 4664.68, aliquota: 22.5, parcela: 662.77 },
      { ate: Infinity, aliquota: 27.5, parcela: 896.00 }
    ];

    let irrf = 0;
    for (const faixa of irrfFaixas) {
      if (baseIRR <= faixa.ate) {
        irrf = Math.max(0, (baseIRR * faixa.aliquota / 100) - faixa.parcela);
        break;
      }
    }

    // Vale Transporte: 6% do salário bruto
    const valeTransporte = salarioBruto * 0.06;

    // Vale Refeição (estimativa: desconto volontário)
    const valeRefeicao = 0; // sem desconto padrão

    const totalDescontos = inss + irrf + valeTransporte;
    const salarioLiquido = salarioBruto - totalDescontos;

    document.getElementById('valorResultado').textContent = `Salário Líquido: ${fmtCurrency(salarioLiquido)}`;
    document.getElementById('detalheResultado').innerHTML = `
      INSS: ${fmtCurrency(inss)} (${fmtPercent((inss/salarioBruto)*100)})<br>
      IRRF: ${fmtCurrency(irrf)} (${fmtPercent((irrf/salarioBruto)*100)})<br>
      Vale Transporte: ${fmtCurrency(valeTransporte)} (6%)<br>
      <strong>Total Descontos: ${fmtCurrency(totalDescontos)}</strong>
    `;
    showResult('resultado');
    return false;
  }
  </script>
</body>
</html>
