<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora IRA - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Financeiras</a> / IRA</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora IRA (Conta de Aposentadoria Individual)</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="contribuicaoAnual">Contribuição Anual (R$)</label>
          <input type="number" id="contribuicaoAnual" step="0.01" placeholder="Ex: 6000" required>
        </div>
        <div class="form-group">
          <label for="idadeAtual">Idade Atual</label>
          <input type="number" id="idadeAtual" placeholder="Ex: 30" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="taxaRetorno">Taxa de Retorno Anual (%)</label>
            <input type="number" id="taxaRetorno" step="0.01" placeholder="Ex: 7" required>
          </div>
          <div class="form-group">
            <label for="anos">Anos de Contribuição</label>
            <input type="number" id="anos" placeholder="Ex: 35" required>
          </div>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var contribuicao = val('contribuicaoAnual');
    var idadeAtual = val('idadeAtual');
    var taxaAnual = val('taxaRetorno') / 100;
    var anos = val('anos');

    var taxaMensal = taxaAnual / 12;
    var meses = anos * 12;
    var contribuicaoMensal = contribuicao / 12;

    // FV of monthly contributions
    var valorFuturo = contribuicaoMensal * ((Math.pow(1 + taxaMensal, meses) - 1) / taxaMensal);

    var totalContribuido = contribuicao * anos;
    var rendimento = valorFuturo - totalContribuido;
    var idadeAposentadoria = idadeAtual + anos;

    // Required Minimum Distribution (RMD) table factors (simplified)
    // Based on IRS Uniform Lifetime Table
    var rmdTable = {
      72: 27.4, 73: 26.5, 74: 25.5, 75: 24.6, 76: 23.7, 77: 22.9,
      78: 22.0, 79: 21.1, 80: 20.2, 81: 19.4, 82: 18.5, 83: 17.7,
      84: 16.8, 85: 16.0, 86: 15.2, 87: 14.4, 88: 13.7, 89: 12.9,
      90: 12.2, 91: 11.5, 92: 10.8, 93: 10.1, 94: 9.5, 95: 8.9
    };

    var idadeRMD = 73; // Idade mínima para RMD (SECURE 2.0 Act)
    var fatorRMD = rmdTable[idadeRMD] || 26.5;
    var rmdPrimeiroAno = valorFuturo / fatorRMD;

    document.getElementById('valorResultado').textContent = 'Valor Futuro: ' + fmtCurrency(valorFuturo);
    document.getElementById('detalheResultado').innerHTML =
      'Total Contribuído: ' + fmtCurrency(totalContribuido) + '<br>' +
      'Rendimento Total: ' + fmtCurrency(rendimento) + '<br>' +
      'Idade na Aposentadoria: ' + idadeAposentadoria + ' anos<br>' +
      'Saldo Estimado aos ' + idadeAposentadoria + ' anos: ' + fmtCurrency(valorFuturo) + '<br><br>' +
      '<strong>Distribuição Mínima Requerida (RMD):</strong><br>' +
      'Início aos ' + idadeRMD + ' anos<br>' +
      'Fator Tabela Uniforme: ' + fatorRMD + '<br>' +
      'RMD Estimado (1º ano): ' + fmtCurrency(rmdPrimeiroAno);
    showResult('resultado');
    return false;
  }
  </script>
</body>
</html>
