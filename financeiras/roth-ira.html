<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roth IRA - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Financeiras</a> / Roth IRA</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora Roth IRA</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="contribuicaoAnual">Contribuição Anual (R$)</label>
          <input type="number" id="contribuicaoAnual" step="0.01" placeholder="Ex: 6000" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="taxaRetorno">Taxa de Retorno Anual (%)</label>
            <input type="number" id="taxaRetorno" step="0.01" placeholder="Ex: 7" required>
          </div>
          <div class="form-group">
            <label for="anos">Número de Anos</label>
            <input type="number" id="anos" placeholder="Ex: 30" required>
          </div>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var contribuicao = val('contribuicaoAnual');
    var taxaAnual = val('taxaRetorno') / 100;
    var anos = val('anos');

    // Future value of annuity (annual contributions, compounded monthly)
    var taxaMensal = taxaAnual / 12;
    var meses = anos * 12;
    var contribuicaoMensal = contribuicao / 12;

    // FV of initial annual contribution distributed monthly for each year
    var valorFuturo = 0;
    for (var y = 0; y < anos; y++) {
      var mesesRestantes = meses - (y * 12);
      valorFuturo += contribuicao * Math.pow(1 + taxaAnual, anos - 1 - y);
    }

    // More accurate: treat as monthly contributions
    valorFuturo = contribuicaoMensal * ((Math.pow(1 + taxaMensal, meses) - 1) / taxaMensal);

    var totalContribuido = contribuicao * anos;
    var rendimento = valorFuturo - totalContribuido;

    document.getElementById('valorResultado').textContent = 'Valor Futuro (Isento): ' + fmtCurrency(valorFuturo);
    document.getElementById('detalheResultado').innerHTML =
      'Total Contribuído: ' + fmtCurrency(totalContribuido) + '<br>' +
      'Rendimento Total: ' + fmtCurrency(rendimento) + '<br>' +
      'Rendimento Percentual: ' + fmtPercent((rendimento / totalContribuido) * 100) + '<br>' +
      'Valor Total (Isento de Impostos): ' + fmtCurrency(valorFuturo) + '<br><br>' +
      '<strong>Vantagem Roth IRA:</strong> Todo o rendimento é isento de impostos ao resgatar após 60,5 anos.';
    showResult('resultado');
    return false;
  }
  </script>
</body>
</html>
