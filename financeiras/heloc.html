<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de HELOC - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Financeiras</a> / HELOC</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de HELOC</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="limiteCredito">Limite de Crédito (R$)</label>
          <input type="number" id="limiteCredito" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="saldo">Saldo Devedor (R$)</label>
          <input type="number" id="saldo" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="taxaJuros">Taxa de Juros Anual (%)</label>
          <input type="number" id="taxaJuros" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="pagamentoMensal">Pagamento Mensal (R$)</label>
          <input type="number" id="pagamentoMensal" step="0.01" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var limite = parseFloat(document.getElementById('limiteCredito').value);
    var saldo = parseFloat(document.getElementById('saldo').value);
    var taxaAnual = parseFloat(document.getElementById('taxaJuros').value) / 100;
    var pagamento = parseFloat(document.getElementById('pagamentoMensal').value);

    var taxaMensal = taxaAnual / 12;
    var jurosMes = saldo * taxaMensal;

    if (pagamento <= jurosMes) {
      document.getElementById('valorResultado').textContent = 'Pagamento insuficiente!';
      document.getElementById('detalheResultado').innerHTML =
        'O pagamento mensal deve ser maior que os juros do mês (R$ ' + jurosMes.toFixed(2) + ')';
      document.getElementById('resultado').style.display = 'block';
      return false;
    }

    var meses = 0;
    var saldoAtual = saldo;
    var totalJuros = 0;

    while (saldoAtual > 0 && meses < 600) {
      var juros = saldoAtual * taxaMensal;
      totalJuros += juros;
      var amortizacao = pagamento - juros;
      saldoAtual -= amortizacao;
      meses++;

      if (saldoAtual < 0) saldoAtual = 0;
    }

    var anos = Math.floor(meses / 12);
    var mesesRestantes = meses % 12;
    var totalPago = saldo + totalJuros;

    var utilizacao = (saldo / limite) * 100;

    document.getElementById('valorResultado').textContent = 'Tempo para quitar: ' + meses + ' meses';
    document.getElementById('detalheResultado').innerHTML =
      (anos > 0 ? anos + ' ano(s) e ' + mesesRestantes + ' mês(es)' : meses + ' meses') + '<br>' +
      'Total de Juros: R$ ' + totalJuros.toFixed(2) + '<br>' +
      'Total Pago: R$ ' + totalPago.toFixed(2) + '<br>' +
      'Utilização do Limite: ' + utilizacao.toFixed(1) + '%';
    document.getElementById('resultado').style.display = 'block';
    return false;
  }
  </script>
</body>
</html>
