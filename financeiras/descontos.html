<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Descontos - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Financeiras</a> / Descontos</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Descontos</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="precoOriginal">Preço Original (R$)</label>
          <input type="number" id="precoOriginal" step="0.01" placeholder="Ex: 200" required>
        </div>
        <div class="form-group">
          <label for="desconto">Desconto (%)</label>
          <input type="number" id="desconto" step="0.01" placeholder="Ex: 15" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var original = val('precoOriginal');
    var desc = val('desconto');
    if (original <= 0) { alert('Informe um preço válido.'); return false; }
    if (desc < 0 || desc > 100) { alert('Desconto deve estar entre 0 e 100%.'); return false; }
    var valorDesconto = original * (desc / 100);
    var precoFinal = original - valorDesconto;
    document.getElementById('valorResultado').textContent = fmtCurrency(precoFinal);
    document.getElementById('detalheResultado').innerHTML =
      'Preço Original: ' + fmtCurrency(original) + '<br>' +
      'Desconto (' + fmtPercent(desc) + '): -' + fmtCurrency(valorDesconto) + '<br>' +
      'Preço Final: ' + fmtCurrency(precoFinal) + '<br>' +
      'Economia: ' + fmtCurrency(valorDesconto);
    showResult('resultado');
    return false;
  }
  </script>
</body>
</html>
