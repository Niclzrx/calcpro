<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Hipotecas no Reino Unido - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Financeiras</a> / Hipotecas Reino Unido</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Hipotecas no Reino Unido</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="valorPropriedade">Valor da Propriedade (£)</label>
          <input type="number" id="valorPropriedade" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="entrada">Entrada (£)</label>
          <input type="number" id="entrada" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="taxaJuros">Taxa de Juros Anual (%)</label>
          <input type="number" id="taxaJuros" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="prazo">Prazo (anos)</label>
          <input type="number" id="prazo" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>&copy; 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var valorPropriedade = parseFloat(document.getElementById('valorPropriedade').value);
    var entrada = parseFloat(document.getElementById('entrada').value);
    var taxaJuros = parseFloat(document.getElementById('taxaJuros').value) / 100;
    var prazo = parseInt(document.getElementById('prazo').value);

    var emprestimo = valorPropriedade - entrada;
    var taxaMensal = taxaJuros / 12;
    var numeroParcelas = prazo * 12;
    var pagamentoMensal;

    if (taxaMensal === 0) {
      pagamentoMensal = emprestimo / numeroParcelas;
    } else {
      pagamentoMensal = emprestimo * (taxaMensal * Math.pow(1 + taxaMensal, numeroParcelas)) /
        (Math.pow(1 + taxaMensal, numeroParcelas) - 1);
    }

    var totalPago = pagamentoMensal * numeroParcelas;
    var totalJuros = totalPago - emprestimo;

    document.getElementById('valorResultado').innerHTML =
      'Pagamento Mensal: £ ' + pagamentoMensal.toFixed(2);
    document.getElementById('detalheResultado').innerHTML =
      'Valor do Empréstimo: £ ' + emprestimo.toFixed(2) +
      '<br>Total de Juros: £ ' + totalJuros.toFixed(2) +
      '<br>Total Pago: £ ' + totalPago.toFixed(2);

    return false;
  }
  </script>
</body>
</html>
