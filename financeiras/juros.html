<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Juros - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Financeiras</a> / Juros</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Juros</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="principal">Capital Inicial (Principal)</label>
          <input type="number" id="principal" placeholder="Ex: 10000" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="taxaJuros">Taxa de Juros Anual (%)</label>
            <input type="number" id="taxaJuros" step="0.01" placeholder="Ex: 10" required>
          </div>
          <div class="form-group">
            <label for="tempoAnos">Tempo (anos)</label>
            <input type="number" id="tempoAnos" placeholder="Ex: 5" required>
          </div>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var p = val('principal');
    var r = val('taxaJuros') / 100;
    var t = val('tempoAnos');
    var jurosSimples = p * r * t;
    var montanteSimples = p + jurosSimples;
    var montanteComposto = p * Math.pow(1 + r, t);
    var jurosComposto = montanteComposto - p;
    document.getElementById('valorResultado').textContent = 'Juros Simples: ' + fmtCurrency(jurosSimples);
    document.getElementById('detalheResultado').innerHTML =
      'Montante Simples: ' + fmtCurrency(montanteSimples) + '<br><br>' +
      'Juros Compostos: ' + fmtCurrency(jurosComposto) + '<br>' +
      'Montante Composto: ' + fmtCurrency(montanteComposto);
    showResult('resultado');
    return false;
  }
  </script>
</body>
</html>
