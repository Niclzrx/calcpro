<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Empréstimo FHA - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Financeiras</a> / Empréstimo FHA</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Empréstimo FHA</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="valorImovel">Valor do Imóvel (R$)</label>
          <input type="number" id="valorImovel" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="entrada">Entrada (R$)</label>
          <input type="number" id="entrada" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="taxaJuros">Taxa de Juros Anual (%)</label>
          <input type="number" id="taxaJuros" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="seguroHipotecario">Seguro Hipotecário Anual (%)</label>
          <input type="number" id="seguroHipotecario" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="prazo">Prazo (anos)</label>
          <input type="number" id="prazo" value="30" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var valorImovel = parseFloat(document.getElementById('valorImovel').value);
    var entrada = parseFloat(document.getElementById('entrada').value);
    var taxaAnual = parseFloat(document.getElementById('taxaJuros').value) / 100;
    var seguroAnual = parseFloat(document.getElementById('seguroHipotecario').value) / 100;
    var anos = parseInt(document.getElementById('prazo').value);

    var valorEmprestimo = valorImovel - entrada;
    var taxaMensal = taxaAnual / 12;
    var n = anos * 12;

    var prestacao;
    if (taxaMensal === 0) {
      prestacao = valorEmprestimo / n;
    } else {
      prestacao = valorEmprestimo * (taxaMensal * Math.pow(1 + taxaMensal, n)) / (Math.pow(1 + taxaMensal, n) - 1);
    }

    var mips = 0.0085;
    if (entrada / valorImovel >= 0.1) {
      mips = 0.008;
    }
    var mipMensal = (valorEmprestimo * mips) / 12;

    var seguroMensal = (valorImovel * seguroAnual) / 12;

    var prestacaoTotal = prestacao + mipMensal + seguroMensal;
    var totalPago = prestacaoTotal * n;

    document.getElementById('valorResultado').textContent = 'Prestação Mensal: R$ ' + prestacaoTotal.toFixed(2);
    document.getElementById('detalheResultado').innerHTML =
      'Principal + Juros: R$ ' + prestacao.toFixed(2) + '<br>' +
      'MIP (Seguro): R$ ' + mipMensal.toFixed(2) + '<br>' +
      'Seguro Hipotecário: R$ ' + seguroMensal.toFixed(2) + '<br>' +
      'Total Pago: R$ ' + totalPago.toFixed(2);
    document.getElementById('resultado').style.display = 'block';
    return false;
  }
  </script>
</body>
</html>
