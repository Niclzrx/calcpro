<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IVA - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Financeiras</a> / IVA</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de IVA</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="valorSemIVA">Valor sem IVA (R$)</label>
          <input type="number" id="valorSemIVA" step="0.01" placeholder="Ex: 1000" required>
        </div>
        <div class="form-group">
          <label for="aliquota">Alíquota IVA (%)</label>
          <input type="number" id="aliquota" step="0.01" placeholder="Ex: 17" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var valor = val('valorSemIVA');
    var aliquota = val('aliquota');
    if (valor < 0) { alert('Informe um valor válido.'); return false; }
    if (aliquota < 0 || aliquota > 100) { alert('Alíquota deve estar entre 0 e 100%.'); return false; }
    var valorIVA = valor * (aliquota / 100);
    var total = valor + valorIVA;
    document.getElementById('valorResultado').textContent = fmtCurrency(total);
    document.getElementById('detalheResultado').innerHTML =
      'Valor sem IVA: ' + fmtCurrency(valor) + '<br>' +
      'IVA (' + fmtPercent(aliquota) + '): ' + fmtCurrency(valorIVA) + '<br>' +
      'Total com IVA: ' + fmtCurrency(total);
    showResult('resultado');
    return false;
  }
  </script>
</body>
</html>
