<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Amortização de Hipoteca - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Financeiras</a> / Amortização de Hipoteca</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Amortização de Hipoteca</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="valorEmprestimo">Valor do Empréstimo (R$)</label>
          <input type="number" id="valorEmprestimo" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="taxaJuros">Taxa de Juros Anual (%)</label>
          <input type="number" id="taxaJuros" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="prazo">Prazo (anos)</label>
          <input type="number" id="prazo" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>&copy; 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var valorEmprestimo = parseFloat(document.getElementById('valorEmprestimo').value);
    var taxaAnual = parseFloat(document.getElementById('taxaJuros').value) / 100;
    var prazo = parseInt(document.getElementById('prazo').value);

    var taxaMensal = taxaAnual / 12;
    var numeroParcelas = prazo * 12;
    var pagamentoMensal;

    if (taxaMensal === 0) {
      pagamentoMensal = valorEmprestimo / numeroParcelas;
    } else {
      pagamentoMensal = valorEmprestimo * (taxaMensal * Math.pow(1 + taxaMensal, numeroParcelas)) /
        (Math.pow(1 + taxaMensal, numeroParcelas) - 1);
    }

    var totalPago = pagamentoMensal * numeroParcelas;
    var totalJuros = totalPago - valorEmprestimo;

    var saldo = valorEmprestimo;
    var tabelaHTML = '<table class="tabela-amortizacao" border="1" cellpadding="8" cellspacing="0" style="width:100%;border-collapse:collapse;margin-top:16px">';
    tabelaHTML += '<tr><th>Mês</th><th>Pagamento</th><th>Juros</th><th>Principal</th><th>Saldo</th></tr>';

    var maxLinhas = Math.min(12, numeroParcelas);
    for (var i = 1; i <= maxLinhas; i++) {
      var jurosMes = saldo * taxaMensal;
      var principalMes = pagamentoMensal - jurosMes;
      saldo -= principalMes;
      if (saldo < 0) saldo = 0;
      tabelaHTML += '<tr><td>' + i + '</td><td>R$ ' + pagamentoMensal.toFixed(2) +
        '</td><td>R$ ' + jurosMes.toFixed(2) +
        '</td><td>R$ ' + principalMes.toFixed(2) +
        '</td><td>R$ ' + saldo.toFixed(2) + '</td></tr>';
    }
    if (numeroParcelas > 12) {
      tabelaHTML += '<tr><td colspan="5" style="text-align:center">... e mais ' + (numeroParcelas - 12) + ' parcelas</td></tr>';
    }
    tabelaHTML += '</table>';

    document.getElementById('valorResultado').innerHTML =
      'Pagamento Mensal: R$ ' + pagamentoMensal.toFixed(2);
    document.getElementById('detalheResultado').innerHTML =
      'Total de Juros: R$ ' + totalJuros.toFixed(2) +
      '<br>Total Pago: R$ ' + totalPago.toFixed(2) +
      tabelaHTML;

    return false;
  }
  </script>
</body>
</html>
