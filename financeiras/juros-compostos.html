<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Juros Compostos - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .result-hero { text-align:center; padding:24px; background:#f8fafc; border-radius:12px; margin-bottom:20px; }
    .result-hero .big-value { font-size:2rem; font-weight:800; color:var(--primary); }
    .result-hero .sub { font-size:0.9rem; color:var(--text-light); }
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; margin:16px 0; }
    .stat-card { padding:14px; background:#f8fafc; border-radius:8px; text-align:center; }
    .stat-card .stat-label { font-size:0.8rem; color:var(--text-light); margin-bottom:4px; }
    .stat-card .stat-value { font-size:1.1rem; font-weight:700; }
    .stat-card.highlight { background:var(--primary); color:#fff; }
    .stat-card.highlight .stat-label { color:rgba(255,255,255,0.8); }
    .year-table { width:100%; border-collapse:collapse; font-size:0.85rem; margin-top:16px; }
    .year-table th { background:#f1f5f9; padding:8px; text-align:right; font-weight:600; }
    .year-table th:first-child { text-align:center; }
    .year-table td { padding:6px 8px; text-align:right; border-bottom:1px solid var(--border); }
    .year-table td:first-child { text-align:center; }
    .year-table .bar-cell { width:40%; }
    .mini-bar { height:16px; border-radius:4px; position:relative; }
    .mini-bar .bar-principal { position:absolute; left:0; top:0; height:100%; background:#2563eb; border-radius:4px 0 0 4px; }
    .mini-bar .bar-juros { position:absolute; top:0; height:100%; background:#f59e0b; }
    .chart-wrap { margin:20px 0; position:relative; }
    .chart-svg { width:100%; height:220px; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Financeiras</a> / Juros Compostos</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Juros Compostos</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="principal">Capital Inicial</label>
          <input type="number" id="principal" step="0.01" placeholder="Ex: 10.000" oninput="calcularAuto()" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="contribuicao">Contribuição Mensal</label>
            <input type="number" id="contribuicao" step="0.01" value="0" oninput="calcularAuto()">
          </div>
          <div class="form-group">
            <label for="taxa">Taxa de Juros Anual (%)</label>
            <input type="number" id="taxa" step="0.01" placeholder="Ex: 10" oninput="calcularAuto()" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="periodo">Período (anos)</label>
            <input type="number" id="periodo" min="1" max="50" placeholder="Ex: 10" oninput="calcularAuto()" required>
          </div>
          <div class="form-group">
            <label for="capitalizacao">Capitalização</label>
            <select id="capitalizacao" onchange="calcularAuto()">
              <option value="12">Mensal</option>
              <option value="1">Anual</option>
              <option value="4">Trimestral</option>
              <option value="2">Semestral</option>
              <option value="365">Diária</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="inflacao">Inflação Anual Estimada (%) (opcional)</label>
          <input type="number" id="inflacao" step="0.01" value="0" oninput="calcularAuto()">
        </div>
        <button type="submit" class="btn" style="width:100%">Calcular</button>
      </form>

      <div class="result" id="resultado">
        <div class="result-hero">
          <div class="sub">Valor Futuro</div>
          <div class="big-value" id="valorFuturo">R$ 0,00</div>
        </div>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="chart-wrap">
          <canvas id="chart" width="800" height="220"></canvas>
        </div>

        <div style="display:flex;gap:16px;margin-bottom:12px;font-size:0.85rem">
          <span><span style="display:inline-block;width:12px;height:12px;background:#2563eb;border-radius:2px;vertical-align:middle"></span> Principal</span>
          <span><span style="display:inline-block;width:12px;height:12px;background:#f59e0b;border-radius:2px;vertical-align:middle"></span> Juros</span>
          <span><span style="display:inline-block;width:12px;height:12px;background:#10b981;border-radius:2px;vertical-align:middle"></span> Contribuições</span>
        </div>

        <table class="year-table" id="yearTable">
          <thead><tr><th>Ano</th><th>Saldo</th><th>Juros</th><th>Total</th><th class="bar-cell">Composição</th></tr></thead>
          <tbody id="yearBody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcularAuto() {
    if (val('principal') > 0 && val('taxa') > 0 && val('periodo') > 0) calcular();
  }

  function calcular() {
    var P = val('principal');
    var PMT = val('contribuicao');
    var r = val('taxa') / 100;
    var t = val('periodo');
    var n = parseInt(document.getElementById('capitalizacao').value);
    var inflacao = val('inflacao') / 100;

    var dados = [];
    var saldo = P;
    var totalContribuido = P;
    var totalJuros = 0;

    for (var ano = 0; ano <= t; ano++) {
      dados.push({
        ano: ano,
        saldo: saldo,
        juros: totalJuros,
        contribuido: totalContribuido
      });
      if (ano < t) {
        for (var j = 0; j < 12; j++) {
          var jurosMes = saldo * (r / 12);
          totalJuros += jurosMes;
          saldo += jurosMes + PMT;
          totalContribuido += PMT;
        }
      }
    }

    var valorFuturo = saldo;
    var totalInvestido = totalContribuido;
    var jurosGanhos = totalJuros;
    var valorReal = inflacao > 0 ? valorFuturo / Math.pow(1 + inflacao, t) : 0;
    var retorno = ((valorFuturo / totalInvestido - 1) * 100).toFixed(1);

    document.getElementById('valorFuturo').textContent = fmtCurrency(valorFuturo);

    var statsHtml = '<div class="stat-card highlight"><div class="stat-label">Valor Futuro</div><div class="stat-value">' + fmtCurrency(valorFuturo) + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Total Investido</div><div class="stat-value">' + fmtCurrency(totalInvestido) + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Juros Ganhos</div><div class="stat-value">' + fmtCurrency(jurosGanhos) + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Retorno</div><div class="stat-value">' + retorno + '%</div></div>';
    if (inflacao > 0) {
      statsHtml += '<div class="stat-card"><div class="stat-label">Valor Real (c/ inflação)</div><div class="stat-value">' + fmtCurrency(valorReal) + '</div></div>';
    }
    document.getElementById('statsGrid').innerHTML = statsHtml;

    drawChart(dados);

    var tbody = '';
    var maxSaldo = dados[dados.length - 1].saldo;
    for (var i = 1; i < dados.length; i++) {
      var d = dados[i];
      var pctPrincipal = (d.contribuido / d.saldo * 100).toFixed(0);
      var pctJuros = (100 - pctPrincipal).toFixed(0);
      tbody += '<tr><td>' + d.ano + '</td><td>' + fmtCurrency(d.saldo) + '</td><td>' + fmtCurrency(d.juros) + '</td><td>' + fmtCurrency(d.contribuido) + '</td>' +
        '<td class="bar-cell"><div class="mini-bar" style="width:100%"><div class="bar-principal" style="width:' + pctPrincipal + '%"></div><div class="bar-juros" style="width:' + pctJuros + '%;left:' + pctPrincipal + '%"></div></div></td></tr>';
    }
    document.getElementById('yearBody').innerHTML = tbody;
    showResult('resultado');
    return false;
  }

  function drawChart(dados) {
    var canvas = document.getElementById('chart');
    var ctx = canvas.getContext('2d');
    var W = canvas.width = canvas.offsetWidth * 2;
    var H = canvas.height = 440;
    ctx.clearRect(0, 0, W, H);

    var maxVal = dados[dados.length - 1].saldo * 1.1;
    var padL = 80, padR = 20, padT = 20, padB = 40;
    var chartW = W - padL - padR;
    var chartH = H - padT - padB;

    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    for (var i = 0; i <= 5; i++) {
      var y = padT + chartH - (i / 5) * chartH;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
      ctx.fillStyle = '#94a3b8';
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(fmtCurrency(maxVal * i / 5), padL - 8, y + 6);
    }

    for (var i = 0; i < dados.length; i++) {
      var x = padL + (i / (dados.length - 1)) * chartW;
      ctx.fillStyle = '#94a3b8';
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(dados[i].ano, x, H - 10);
    }

    ctx.beginPath();
    ctx.moveTo(padL, padT + chartH - (dados[0].contribuido / maxVal) * chartH);
    for (var i = 0; i < dados.length; i++) {
      var x = padL + (i / (dados.length - 1)) * chartW;
      var y = padT + chartH - (dados[i].contribuido / maxVal) * chartH;
      ctx.lineTo(x, y);
    }
    ctx.strokeStyle = '#10b981';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(padL, padT + chartH - (dados[0].saldo / maxVal) * chartH);
    for (var i = 0; i < dados.length; i++) {
      var x = padL + (i / (dados.length - 1)) * chartW;
      var y = padT + chartH - (dados[i].saldo / maxVal) * chartH;
      ctx.lineTo(x, y);
    }
    ctx.strokeStyle = '#2563eb';
    ctx.lineWidth = 3;
    ctx.stroke();

    for (var i = 0; i < dados.length; i++) {
      var x = padL + (i / (dados.length - 1)) * chartW;
      var y = padT + chartH - (dados[i].saldo / maxVal) * chartH;
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#2563eb';
      ctx.fill();
    }
  }
  </script>
</body>
</html>
