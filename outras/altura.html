<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Altura - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Altura</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Altura</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="tipo">Converter de</label>
          <select id="tipo" onchange="atualizarCampos()">
            <option value="imperial-para-metrico">Pés e Polegadas → Centímetros</option>
            <option value="metrico-para-imperial">Centímetros → Pés e Polegadas</option>
          </select>
        </div>
        <div id="camposImperial">
          <div class="form-group">
            <label for="pes">Pés</label>
            <input type="number" id="pes" min="0" step="1" required>
          </div>
          <div class="form-group">
            <label for="polegadas">Polegadas</label>
            <input type="number" id="polegadas" min="0" max="11" step="0.1" required>
          </div>
        </div>
        <div id="camposMetrico" style="display:none;">
          <div class="form-group">
            <label for="centimetros">Centímetros</label>
            <input type="number" id="centimetros" min="0" step="0.1" required>
          </div>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function atualizarCampos() {
    const tipo = document.getElementById('tipo').value;
    document.getElementById('camposImperial').style.display = tipo === 'imperial-para-metrico' ? 'block' : 'none';
    document.getElementById('camposMetrico').style.display = tipo === 'metrico-para-imperial' ? 'block' : 'none';
  }

  function calcular() {
    const tipo = document.getElementById('tipo').value;

    if (tipo === 'imperial-para-metrico') {
      const pes = parseFloat(document.getElementById('pes').value) || 0;
      const polegadas = parseFloat(document.getElementById('polegadas').value) || 0;
      const totalPolegadas = pes * 12 + polegadas;
      const cm = totalPolegadas * 2.54;
      const metros = cm / 100;

      document.getElementById('valorResultado').textContent = cm.toFixed(1) + ' cm';
      document.getElementById('detalheResultado').textContent = metros.toFixed(2) + ' metros';
    } else {
      const cm = parseFloat(document.getElementById('centimetros').value) || 0;
      const totalPolegadas = cm / 2.54;
      const pes = Math.floor(totalPolegadas / 12);
      const polegadasRestantes = totalPolegadas % 12;
      const metros = cm / 100;

      document.getElementById('valorResultado').textContent = pes + ' ft ' + polegadasRestantes.toFixed(1) + ' in';
      document.getElementById('detalheResultado').textContent = metros.toFixed(2) + ' metros';
    }
    return false;
  }
  </script>
</body>
</html>
