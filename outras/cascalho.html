<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Cascalho - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Cascalho</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Cascalho</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="comprimento">Comprimento (m)</label>
          <input type="number" id="comprimento" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="largura">Largura (m)</label>
          <input type="number" id="largura" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="profundidade">Profundidade (cm)</label>
          <input type="number" id="profundidade" step="0.1" value="10" required>
        </div>
        <div class="form-group">
          <label for="densidade">Densidade do Cascalho (t/m³)</label>
          <input type="number" id="densidade" step="0.01" value="1.8">
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const comprimento = val('comprimento');
    const largura = val('largura');
    const profundidade = val('profundidade');
    const densidade = val('densidade');

    const profundidadeM = profundidade / 100;
    const volume = comprimento * largura * profundidadeM;
    const toneladas = volume * densidade;

    document.getElementById('valorResultado').textContent = fmt(volume) + ' m³';
    document.getElementById('detalheResultado').textContent =
      'Volume: ' + fmt(volume) + ' m³ | Peso estimado: ' + fmt(toneladas) + ' toneladas (' + fmt(toneladas * 1000) + ' kg)';
    document.getElementById('resultado').classList.add('show');
    return false;
  }
  </script>
</body>
</html>
