<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Notas - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Notas</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Notas Ponderadas</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="nota1">Nota 1 (Peso 1)</label>
          <input type="number" id="nota1" min="0" max="10" step="0.1" required>
        </div>
        <div class="form-group">
          <label for="peso1">Peso 1</label>
          <input type="number" id="peso1" min="1" step="1" value="1" required>
        </div>
        <div class="form-group">
          <label for="nota2">Nota 2 (Peso 2)</label>
          <input type="number" id="nota2" min="0" max="10" step="0.1" required>
        </div>
        <div class="form-group">
          <label for="peso2">Peso 2</label>
          <input type="number" id="peso2" min="1" step="1" value="1" required>
        </div>
        <div class="form-group">
          <label for="nota3">Nota 3 (Peso 3)</label>
          <input type="number" id="nota3" min="0" max="10" step="0.1" required>
        </div>
        <div class="form-group">
          <label for="peso3">Peso 3</label>
          <input type="number" id="peso3" min="1" step="1" value="1" required>
        </div>
        <div class="form-group">
          <label for="nota4">Nota 4 (Peso 4)</label>
          <input type="number" id="nota4" min="0" max="10" step="0.1" required>
        </div>
        <div class="form-group">
          <label for="peso4">Peso 4</label>
          <input type="number" id="peso4" min="1" step="1" value="1" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const n1 = parseFloat(document.getElementById('nota1').value);
    const p1 = parseFloat(document.getElementById('peso1').value);
    const n2 = parseFloat(document.getElementById('nota2').value);
    const p2 = parseFloat(document.getElementById('peso2').value);
    const n3 = parseFloat(document.getElementById('nota3').value);
    const p3 = parseFloat(document.getElementById('peso3').value);
    const n4 = parseFloat(document.getElementById('nota4').value);
    const p4 = parseFloat(document.getElementById('peso4').value);

    const somaPesos = p1 + p2 + p3 + p4;
    const somaNotas = n1 * p1 + n2 * p2 + n3 * p3 + n4 * p4;
    const media = somaNotas / somaPesos;

    document.getElementById('valorResultado').textContent = media.toFixed(2);
    document.getElementById('detalheResultado').textContent = 'Média ponderada das notas';
    return false;
  }
  </script>
</body>
</html>
