<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Consumo de Combustível - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Consumo de Combustível</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Consumo de Combustível</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="distancia">Distância Percorrida (km)</label>
          <input type="number" id="distancia" step="0.1" min="0.1" placeholder="Ex: 450" required>
        </div>
        <div class="form-group">
          <label for="combustivel">Combustível Gasto (litros)</label>
          <input type="number" id="combustivel" step="0.01" min="0.01" placeholder="Ex: 35" required>
        </div>
        <div class="form-group">
          <label for="preco">Preço por Litro (R$)</label>
          <input type="number" id="preco" step="0.01" min="0.01" value="5.50" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const distancia = parseFloat(document.getElementById('distancia').value);
    const combustivel = parseFloat(document.getElementById('combustivel').value);
    const preco = parseFloat(document.getElementById('preco').value);

    if (isNaN(distancia) || isNaN(combustivel) || isNaN(preco) || distancia <= 0 || combustivel <= 0 || preco <= 0) {
      document.getElementById('valorResultado').textContent = 'Valores inválidos';
      document.getElementById('detalheResultado').textContent = '';
      return false;
    }

    const kmPorLitro = distancia / combustivel;
    const litrosPor100km = 100 / kmPorLitro;
    const custoKm = combustivel * preco / distancia;
    const custoTotal = combustivel * preco;

    document.getElementById('valorResultado').textContent = kmPorLitro.toFixed(2) + ' km/l';
    document.getElementById('detalheResultado').innerHTML =
      litrosPor100km.toFixed(2) + ' l/100km<br>' +
      'Custo por km: R$ ' + custoKm.toFixed(2) + '<br>' +
      'Custo total da viagem: R$ ' + custoTotal.toFixed(2);
    return false;
  }
  </script>
</body>
</html>
