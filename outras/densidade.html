<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Densidade - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Densidade</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Densidade</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="massa">Massa (g)</label>
          <input type="number" id="massa" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="volume">Volume (cm³)</label>
          <input type="number" id="volume" step="0.01" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const massa = val('massa');
    const volume = val('volume');

    if (volume <= 0) {
      document.getElementById('valorResultado').textContent = 'Volume deve ser maior que zero';
      document.getElementById('detalheResultado').textContent = '';
      document.getElementById('resultado').classList.add('show');
      return false;
    }

    const densidade = massa / volume;

    document.getElementById('valorResultado').textContent = fmt(densidade) + ' g/cm³';
    document.getElementById('detalheResultado').textContent =
      'Densidade em kg/m³: ' + fmt(densidade * 1000);
    document.getElementById('resultado').classList.add('show');
    return false;
  }
  </script>
</body>
</html>
