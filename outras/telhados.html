<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Telhados - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Telhados</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Telhados</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="comprimento">Comprimento do Telhado (m)</label>
          <input type="number" id="comprimento" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="largura">Largura (m)</label>
          <input type="number" id="largura" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="inclinacao">Inclinação (graus)</label>
          <input type="number" id="inclinacao" step="0.1" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const comprimento = val('comprimento');
    const largura = val('largura');
    const inclinacao = val('inclinacao');

    const rad = inclinacao * Math.PI / 180;
    const fatorInclinacao = 1 / Math.cos(rad);
    const areaInclinada = comprimento * largura * fatorInclinacao;
    const areaPlana = comprimento * largura;

    document.getElementById('valorResultado').textContent = fmt(areaInclinada) + ' m²';
    document.getElementById('detalheResultado').textContent =
      'Área plana: ' + fmt(areaPlana) + ' m² | Fator inclinação: ' + fmt(fatorInclinacao, 3) + ' | Área real: ' + fmt(areaInclinada) + ' m²';
    document.getElementById('resultado').classList.add('show');
    return false;
  }
  </script>
</body>
</html>
