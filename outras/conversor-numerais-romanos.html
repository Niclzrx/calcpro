<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Numerais Romanos - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Conversor de Numerais Romanos</div>
    </div>
    <div class="calc-card">
      <h1>Conversor de Numerais Romanos</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="entrada">Número (1-3999) ou Numeral Romano</label>
          <input type="text" id="entrada" placeholder="Ex: 42 ou XLII" required>
        </div>
        <button type="submit" class="btn">Converter</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function paraRomano(num) {
    const val = [1000,900,500,400,100,90,50,40,10,9,5,4,1];
    const rom = ['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
    let resultado = '';
    for (let i = 0; i < val.length; i++) {
      while (num >= val[i]) { resultado += rom[i]; num -= val[i]; }
    }
    return resultado;
  }

  function deRomano(str) {
    const map = { I:1, V:5, X:10, L:50, C:100, D:500, M:1000 };
    let resultado = 0;
    for (let i = 0; i < str.length; i++) {
      const atual = map[str[i]];
      const proximo = map[str[i + 1]];
      if (proximo && atual < proximo) { resultado -= atual; }
      else { resultado += atual; }
    }
    return resultado;
  }

  function calcular() {
    const entrada = document.getElementById('entrada').value.trim().toUpperCase();
    if (!entrada) return false;

    const isRoman = /^[IVXLCDM]+$/.test(entrada);
    const isNumber = /^\d+$/.test(entrada);

    if (isNumber) {
      const num = parseInt(entrada);
      if (num < 1 || num > 3999) {
        document.getElementById('valorResultado').textContent = 'Número fora do intervalo (1-3999)';
        document.getElementById('detalheResultado').textContent = '';
        document.getElementById('resultado').classList.add('show');
        return false;
      }
      document.getElementById('valorResultado').textContent = paraRomano(num);
      document.getElementById('detalheResultado').textContent = entrada + ' em numerais romanos = ' + paraRomano(num);
    } else if (isRoman) {
      const num = deRomano(entrada);
      if (num <= 0 || num > 3999) {
        document.getElementById('valorResultado').textContent = 'Numeral romano inválido';
        document.getElementById('detalheResultado').textContent = '';
        document.getElementById('resultado').classList.add('show');
        return false;
      }
      document.getElementById('valorResultado').textContent = num;
      document.getElementById('detalheResultado').textContent = entrada + ' em número = ' + num;
    } else {
      document.getElementById('valorResultado').textContent = 'Entrada inválida';
      document.getElementById('detalheResultado').textContent = 'Digite um número ou numeral romano';
    }

    document.getElementById('resultado').classList.add('show');
    return false;
  }
  </script>
</body>
</html>
