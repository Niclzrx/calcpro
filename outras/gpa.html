<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de GPA - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de GPA</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de GPA</h1>
      <form onsubmit="return calcular()">
        <div id="cursos">
          <div class="form-row">
            <div class="form-group">
              <label>Nota</label>
              <input type="number" class="nota" min="0" max="10" step="0.1" required>
            </div>
            <div class="form-group">
              <label>Créditos</label>
              <input type="number" class="credito" min="1" step="1" required>
            </div>
          </div>
        </div>
        <div class="form-group">
          <button type="button" class="btn-secondary" onclick="adicionarCurso()">+ Adicionar Disciplina</button>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function adicionarCurso() {
    const container = document.getElementById('cursos');
    const div = document.createElement('div');
    div.className = 'form-row';
    div.innerHTML = '<div class="form-group"><label>Nota</label><input type="number" class="nota" min="0" max="10" step="0.1" required></div><div class="form-group"><label>Créditos</label><input type="number" class="credito" min="1" step="1" required></div>';
    container.appendChild(div);
  }

  function calcular() {
    const notas = document.querySelectorAll('.nota');
    const creditos = document.querySelectorAll('.credito');

    let somaNotasCreditos = 0;
    let somaCreditos = 0;

    for (let i = 0; i < notas.length; i++) {
      const nota = parseFloat(notas[i].value);
      const credito = parseInt(creditos[i].value);
      somaNotasCreditos += nota * credito;
      somaCreditos += credito;
    }

    if (somaCreditos === 0) {
      document.getElementById('valorResultado').textContent = 'Nenhum crédito informado';
      document.getElementById('detalheResultado').textContent = '';
      return false;
    }

    const gpa = somaNotasCreditos / somaCreditos;

    document.getElementById('valorResultado').textContent = gpa.toFixed(2);
    document.getElementById('detalheResultado').textContent = 'Média ponderada por créditos (escala 0-10)';
    return false;
  }
  </script>
</body>
</html>
