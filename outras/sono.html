<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora do Sono - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora do Sono</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora do Sono</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="modo">Modo</label>
          <select id="modo">
            <option value="dormir">Preciso dormir (informe hora de acordar)</option>
            <option value="acordar">Preciso acordar (informe hora de dormir)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="horario">Horário</label>
          <input type="time" id="horario" required>
        </div>
        <div class="form-group">
          <label for="tempoAdormecer">Tempo para adormecer (minutos)</label>
          <input type="number" id="tempoAdormecer" value="14" min="0">
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const modo = document.getElementById('modo').value;
    const horario = document.getElementById('horario').value;
    const tempoAdormecer = val('tempoAdormecer');

    const [h, m] = horario.split(':').map(Number);
    let minutos = h * 60 + m;
    const ciclo = 90;

    let sugestoes = [];

    if (modo === 'dormir') {
      for (let i = 6; i >= 3; i--) {
        let tempoDormir = minutos - (i * ciclo) - tempoAdormecer;
        if (tempoDormir < 0) tempoDormir += 24 * 60;
        const hh = Math.floor(tempoDormir / 60) % 24;
        const mm = tempoDormir % 60;
        sugestoes.push(i + ' ciclos (' + (i * 90 / 60).toFixed(1) + 'h): ' +
          String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0'));
      }
      document.getElementById('valorResultado').textContent = 'Horários sugeridos para dormir';
    } else {
      for (let i = 3; i <= 6; i++) {
        let tempoAcordar = minutos + (i * ciclo) + tempoAdormecer;
        if (tempoAcordar >= 24 * 60) tempoAcordar -= 24 * 60;
        const hh = Math.floor(tempoAcordar / 60) % 24;
        const mm = tempoAcordar % 60;
        sugestoes.push(i + ' ciclos (' + (i * 90 / 60).toFixed(1) + 'h): ' +
          String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0'));
      }
      document.getElementById('valorResultado').textContent = 'Horários sugeridos para acordar';
    }

    document.getElementById('detalheResultado').textContent = sugestoes.join(' | ');
    document.getElementById('resultado').classList.add('show');
    return false;
  }
  </script>
</body>
</html>
