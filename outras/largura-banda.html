<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Largura de Banda - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Largura de Banda</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Largura de Banda</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="tamanho">Tamanho do Arquivo (MB)</label>
          <input type="number" id="tamanho" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="velocidade">Velocidade da Conexão (Mbps)</label>
          <input type="number" id="velocidade" step="0.01" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const tamanho = val('tamanho');
    const velocidade = val('velocidade');

    if (velocidade <= 0) {
      document.getElementById('valorResultado').textContent = 'Velocidade deve ser maior que zero';
      document.getElementById('detalheResultado').textContent = '';
      document.getElementById('resultado').classList.add('show');
      return false;
    }

    const segundos = (tamanho * 8) / velocidade;
    const horas = Math.floor(segundos / 3600);
    const minutos = Math.floor((segundos % 3600) / 60);
    const segs = Math.floor(segundos % 60);

    let tempoStr = '';
    if (horas > 0) tempoStr += horas + 'h ';
    if (minutos > 0) tempoStr += minutos + 'min ';
    tempoStr += segs + 's';

    document.getElementById('valorResultado').textContent = tempoStr;
    document.getElementById('detalheResultado').textContent =
      'Tempo estimado de download: ' + fmt(segundos) + ' segundos | ' +
      'Tamanho: ' + tamanho + ' MB | Velocidade: ' + velocidade + ' Mbps';
    document.getElementById('resultado').classList.add('show');
    return false;
  }
  </script>
</body>
</html>
