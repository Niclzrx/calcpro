<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Fuso Horário - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Fuso Horário</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Fuso Horário</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="hora">Hora</label>
          <input type="time" id="hora" required>
        </div>
        <div class="form-group">
          <label for="fusoOrigem">Fuso Horário de Origem (UTC)</label>
          <select id="fusoOrigem" required>
            <option value="-12">UTC-12</option>
            <option value="-11">UTC-11</option>
            <option value="-10">UTC-10 (Havaí)</option>
            <option value="-9">UTC-9</option>
            <option value="-8">UTC-8 (Los Angeles)</option>
            <option value="-7">UTC-7 (Denver)</option>
            <option value="-6">UTC-6 (Cidade do México)</option>
            <option value="-5" selected>UTC-5 (Nova York, Bogotá)</option>
            <option value="-4">UTC-4 (Santiago)</option>
            <option value="-3">UTC-3 (São Paulo, Buenos Aires)</option>
            <option value="-2">UTC-2</option>
            <option value="-1">UTC-1</option>
            <option value="0">UTC+0 (Londres)</option>
            <option value="1">UTC+1 (Paris, Roma)</option>
            <option value="2">UTC+2 (Cairo, Joanesburgo)</option>
            <option value="3">UTC+3 (Moscou)</option>
            <option value="4">UTC+4 (Dubai)</option>
            <option value="5">UTC+5</option>
            <option value="5.5">UTC+5:30 (Índia)</option>
            <option value="6">UTC+6</option>
            <option value="7">UTC+7</option>
            <option value="8">UTC+8 (Pequim)</option>
            <option value="9">UTC+9 (Tóquio)</option>
            <option value="10">UTC+10 (Sydney)</option>
            <option value="11">UTC+11</option>
            <option value="12">UTC+12 (Auckland)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="fusoDestino">Fuso Horário de Destino (UTC)</label>
          <select id="fusoDestino" required>
            <option value="-12">UTC-12</option>
            <option value="-11">UTC-11</option>
            <option value="-10">UTC-10 (Havaí)</option>
            <option value="-9">UTC-9</option>
            <option value="-8">UTC-8 (Los Angeles)</option>
            <option value="-7">UTC-7 (Denver)</option>
            <option value="-6">UTC-6 (Cidade do México)</option>
            <option value="-5">UTC-5 (Nova York, Bogotá)</option>
            <option value="-4">UTC-4 (Santiago)</option>
            <option value="-3">UTC-3 (São Paulo, Buenos Aires)</option>
            <option value="-2">UTC-2</option>
            <option value="-1">UTC-1</option>
            <option value="0">UTC+0 (Londres)</option>
            <option value="1" selected>UTC+1 (Paris, Roma)</option>
            <option value="2">UTC+2 (Cairo, Joanesburgo)</option>
            <option value="3">UTC+3 (Moscou)</option>
            <option value="4">UTC+4 (Dubai)</option>
            <option value="5">UTC+5</option>
            <option value="5.5">UTC+5:30 (Índia)</option>
            <option value="6">UTC+6</option>
            <option value="7">UTC+7</option>
            <option value="8">UTC+8 (Pequim)</option>
            <option value="9">UTC+9 (Tóquio)</option>
            <option value="10">UTC+10 (Sydney)</option>
            <option value="11">UTC+11</option>
            <option value="12">UTC+12 (Auckland)</option>
          </select>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const horaStr = document.getElementById('hora').value;
    const fusoOrigem = parseFloat(document.getElementById('fusoOrigem').value);
    const fusoDestino = parseFloat(document.getElementById('fusoDestino').value);

    if (!horaStr) {
      document.getElementById('valorResultado').textContent = 'Informe um horário';
      document.getElementById('detalheResultado').textContent = '';
      return false;
    }

    const [h, m] = horaStr.split(':').map(Number);
    const totalMinOrigem = h * 60 + m;
    const diffMin = (fusoDestino - fusoOrigem) * 60;
    let totalMinDestino = (totalMinOrigem + diffMin) % (24 * 60);

    if (totalMinDestino < 0) totalMinDestino += 24 * 60;

    const hDestino = Math.floor(totalMinDestino / 60);
    const mDestino = totalMinDestino % 60;
    const horaFormatada = String(hDestino).padStart(2, '0') + ':' + String(mDestino).padStart(2, '0');

    const diffHoras = fusoDestino - fusoOrigem;
    const diffFormatado = diffHoras >= 0 ? '+' + diffHoras : String(diffHoras);

    const diasDiff = totalMinDestino < totalMinOrigem ? ' (próximo dia)' :
                     totalMinDestino > totalMinOrigem + 12 * 60 ? ' (mesmo dia)' : '';

    document.getElementById('valorResultado').textContent = horaFormatada;
    document.getElementById('detalheResultado').textContent =
      'Diferença: ' + diffFormatado + ' horas' + diasDiff;
    return false;
  }
  </script>
</body>
</html>
