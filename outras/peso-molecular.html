<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Peso Molecular - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Peso Molecular</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Peso Molecular</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="carbono">Carbono (C)</label>
          <input type="number" id="carbono" value="0" min="0" required>
        </div>
        <div class="form-group">
          <label for="hidrogenio">Hidrogênio (H)</label>
          <input type="number" id="hidrogenio" value="0" min="0" required>
        </div>
        <div class="form-group">
          <label for="oxigenio">Oxigênio (O)</label>
          <input type="number" id="oxigenio" value="0" min="0" required>
        </div>
        <div class="form-group">
          <label for="nitrogenio">Nitrogênio (N)</label>
          <input type="number" id="nitrogenio" value="0" min="0" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const c = val('carbono');
    const h = val('hidrogenio');
    const o = val('oxigenio');
    const n = val('nitrogenio');

    const massas = { C: 12.011, H: 1.008, O: 15.999, N: 14.007 };
    const peso = c * massas.C + h * massas.H + o * massas.O + n * massas.N;

    let formula = '';
    if (c > 0) formula += 'C' + (c > 1 ? c : '');
    if (h > 0) formula += 'H' + (h > 1 ? h : '');
    if (o > 0) formula += 'O' + (o > 1 ? o : '');
    if (n > 0) formula += 'N' + (n > 1 ? n : '');

    document.getElementById('valorResultado').textContent = fmt(peso) + ' g/mol';
    document.getElementById('detalheResultado').textContent =
      'Fórmula: ' + (formula || 'Nenhum elemento') + ' | Massa: ' + fmt(peso, 4) + ' g/mol';
    document.getElementById('resultado').classList.add('show');
    return false;
  }
  </script>
</body>
</html>
