<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Gorjetas - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Inicio</a> / <a href="index.html">Outras</a> / Calculadora de Gorjetas</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Gorjetas</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="conta">Valor da Conta (R$)</label>
          <input type="number" id="conta" step="0.01" min="0.01" placeholder="Ex: 150" required>
        </div>
        <div class="form-group">
          <label for="gorjeta">Percentual de Gorjeta (%)</label>
          <input type="number" id="gorjeta" step="1" min="1" max="100" value="10" required>
        </div>
        <div class="form-group">
          <label for="pessoas">Numero de Pessoas</label>
          <input type="number" id="pessoas" min="1" value="1" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>&copy; 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var conta = parseFloat(document.getElementById('conta').value);
    var gorjetaPct = parseFloat(document.getElementById('gorjeta').value);
    var pessoas = parseInt(document.getElementById('pessoas').value);
    if (isNaN(conta) || isNaN(gorjetaPct) || isNaN(pessoas) ||
        conta <= 0 || gorjetaPct <= 0 || pessoas <= 0) {
      document.getElementById('valorResultado').textContent = 'Valores invalidos';
      document.getElementById('detalheResultado').textContent = '';
      return false;
    }
    var valorGorjeta = conta * (gorjetaPct / 100);
    var total = conta + valorGorjeta;
    var porPessoa = total / pessoas;
    var gorjetaPorPessoa = valorGorjeta / pessoas;
    document.getElementById('valorResultado').textContent = 'R$ ' + total.toFixed(2);
    document.getElementById('detalheResultado').innerHTML =
      'Gorjeta (R$ ' + gorjetaPct + '%): R$ ' + valorGorjeta.toFixed(2) + '<br>' +
      'Total com gorjeta: R$ ' + total.toFixed(2) + '<br>' +
      'Por pessoa: R$ ' + porPessoa.toFixed(2) + '<br>' +
      'Gorjeta por pessoa: R$ ' + gorjetaPorPessoa.toFixed(2);
    return false;
  }
  </script>
</body>
</html>
