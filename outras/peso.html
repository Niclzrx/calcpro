<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Peso - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Peso</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Peso</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="massa">Massa (kg)</label>
          <input type="number" id="massa" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="gravidade">Gravidade (m/s²)</label>
          <input type="number" id="gravidade" step="0.01" value="9.81">
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const massa = val('massa');
    const gravidade = val('gravidade');

    const peso = massa * gravidade;

    document.getElementById('valorResultado').textContent = fmt(peso) + ' N';
    document.getElementById('detalheResultado').textContent =
      peso + ' Newtons = ' + fmt(peso * 0.10197) + ' kgf';
    document.getElementById('resultado').classList.add('show');
    return false;
  }
  </script>
</body>
</html>
