<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de Dias - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Contador de Dias</div>
    </div>
    <div class="calc-card">
      <h1>Contador de Dias</h1>
      <form onsubmit="return calcular()">
        <div class="form-row">
          <div class="form-group">
            <label for="dataInicio">Data Início</label>
            <input type="date" id="dataInicio" required>
          </div>
          <div class="form-group">
            <label for="dataFim">Data Fim</label>
            <input type="date" id="dataFim" required>
          </div>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const inicio = new Date(document.getElementById('dataInicio').value + 'T00:00:00');
    const fim = new Date(document.getElementById('dataFim').value + 'T00:00:00');

    const diffMs = Math.abs(fim - inicio);
    const dias = Math.round(diffMs / (1000 * 60 * 60 * 24));
    const semanas = Math.floor(dias / 7);
    const diasRestante = dias % 7;

    document.getElementById('valorResultado').textContent = dias + ' dias';
    document.getElementById('detalheResultado').textContent =
      semanas + ' semanas e ' + diasRestante + ' dias';
    document.getElementById('resultado').classList.add('show');
    return false;
  }
  </script>
</body>
</html>
