<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Molaridade - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Molaridade</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Molaridade</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="massaSoluto">Massa do Soluto (g)</label>
          <input type="number" id="massaSoluto" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="massaMolecular">Massa Molecular (g/mol)</label>
          <input type="number" id="massaMolecular" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="volumeSolucao">Volume da Solução (mL)</label>
          <input type="number" id="volumeSolucao" step="0.01" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const massa = val('massaSoluto');
    const mw = val('massaMolecular');
    const volume = val('volumeSolucao');

    if (mw <= 0 || volume <= 0) {
      document.getElementById('valorResultado').textContent = 'Valores inválidos';
      document.getElementById('detalheResultado').textContent = '';
      document.getElementById('resultado').classList.add('show');
      return false;
    }

    const volumeL = volume / 1000;
    const molaridade = massa / (mw * volumeL);
    const milimolar = molaridade * 1000;

    document.getElementById('valorResultado').textContent = fmt(molaridade) + ' mol/L';
    document.getElementById('detalheResultado').textContent =
      'Molaridade: ' + fmt(molaridade) + ' M | ' + fmt(milimolar) + ' mM';
    document.getElementById('resultado').classList.add('show');
    return false;
  }
  </script>
</body>
</html>
