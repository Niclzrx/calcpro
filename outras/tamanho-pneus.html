<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Tamanho de Pneus - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Tamanho de Pneus</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Tamanho de Pneus</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="largura">Largura (mm) - Ex: 205</label>
          <input type="number" id="largura" required>
        </div>
        <div class="form-group">
          <label for="perfil">Perfil (%) - Ex: 55</label>
          <input type="number" id="perfil" required>
        </div>
        <div class="form-group">
          <label for="aro">Aro (polegadas) - Ex: 16</label>
          <input type="number" id="aro" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const largura = val('largura');
    const perfil = val('perfil');
    const aro = val('aro');

    if (largura <= 0 || perfil <= 0 || aro <= 0) {
      document.getElementById('valorResultado').textContent = 'Valores inválidos';
      document.getElementById('detalheResultado').textContent = '';
      document.getElementById('resultado').classList.add('show');
      return false;
    }

    const perfilAltura = largura * (perfil / 100);
    const aroMm = aro * 25.4;
    const diametroExterno = aroMm + (2 * perfilAltura);
    const circunferencia = Math.PI * diametroExterno;
    const rotacoesKm = 1000000 / circunferencia;

    const codPneu = largura + '/' + perfil + 'R' + aro;

    document.getElementById('valorResultado').textContent = codPneu;
    document.getElementById('detalheResultado').textContent =
      'Altura do perfil: ' + fmt(perfilAltura, 0) + ' mm | ' +
      'Diâmetro externo: ' + fmt(diametroExterno, 1) + ' mm (' + fmt(diametroExterno / 25.4, 1) + ' pol) | ' +
      'Rotações por km: ' + fmt(rotacoesKm, 0);
    document.getElementById('resultado').classList.add('show');
    return false;
  }
  </script>
</body>
</html>
