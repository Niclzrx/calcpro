<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Quilometragem - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Quilometragem</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Quilometragem</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="kmAnterior">KM Anteriores</label>
          <input type="number" id="kmAnterior" step="0.1" required>
        </div>
        <div class="form-group">
          <label for="kmAtual">KM Atuais</label>
          <input type="number" id="kmAtual" step="0.1" required>
        </div>
        <div class="form-group">
          <label for="litros">Litros Abastecidos</label>
          <input type="number" id="litros" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="precoLitro">Preço por Litro (R$)</label>
          <input type="number" id="precoLitro" step="0.01" value="5.50">
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const kmAnt = val('kmAnterior');
    const kmAtu = val('kmAtual');
    const litros = val('litros');
    const preco = val('precoLitro');

    if (kmAtu <= kmAnt || litros <= 0) {
      document.getElementById('valorResultado').textContent = 'Valores inválidos';
      document.getElementById('detalheResultado').textContent = '';
      document.getElementById('resultado').classList.add('show');
      return false;
    }

    const distancia = kmAtu - kmAnt;
    const kmLitro = distancia / litros;
    const custo = litros * preco;
    const custoKm = custo / distancia;

    document.getElementById('valorResultado').textContent = fmt(kmLitro) + ' km/l';
    document.getElementById('detalheResultado').textContent =
      'Distância: ' + fmt(distancia, 1) + ' km | Consumo total: ' + fmtCurrency(custo) + ' | Custo/km: ' + fmtCurrency(custoKm);
    document.getElementById('resultado').classList.add('show');
    return false;
  }
  </script>
</body>
</html>
