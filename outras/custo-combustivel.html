<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Custo de Combustível - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Custo de Combustível</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Custo de Combustível</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="distancia">Distância (km)</label>
          <input type="number" id="distancia" min="0" step="0.1" required>
        </div>
        <div class="form-group">
          <label for="consumo">Consumo do Veículo (km/l)</label>
          <input type="number" id="consumo" min="0.1" step="0.1" required>
        </div>
        <div class="form-group">
          <label for="precoLitro">Preço do Litro (R$)</label>
          <input type="number" id="precoLitro" min="0" step="0.01" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const distancia = parseFloat(document.getElementById('distancia').value);
    const consumo = parseFloat(document.getElementById('consumo').value);
    const precoLitro = parseFloat(document.getElementById('precoLitro').value);

    const litrosNecessarios = distancia / consumo;
    const custoTotal = litrosNecessarios * precoLitro;
    const custoPorKm = custoTotal / distancia;

    document.getElementById('valorResultado').textContent = 'R$ ' + custoTotal.toFixed(2);
    document.getElementById('detalheResultado').innerHTML =
      litrosNecessarios.toFixed(2) + ' litros necessários<br>' +
      'Custo por km: R$ ' + custoPorKm.toFixed(3);
    return false;
  }
  </script>
</body>
</html>
