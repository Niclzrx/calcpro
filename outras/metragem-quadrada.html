<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Metragem Quadrada - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Metragem Quadrada</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Metragem Quadrada</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="comprimento">Comprimento (m)</label>
          <input type="number" id="comprimento" step="0.01" min="0.01" placeholder="Ex: 5" required>
        </div>
        <div class="form-group">
          <label for="largura">Largura (m)</label>
          <input type="number" id="largura" step="0.01" min="0.01" placeholder="Ex: 4" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const comprimento = parseFloat(document.getElementById('comprimento').value);
    const largura = parseFloat(document.getElementById('largura').value);

    if (isNaN(comprimento) || isNaN(largura) || comprimento <= 0 || largura <= 0) {
      document.getElementById('valorResultado').textContent = 'Valores inválidos';
      document.getElementById('detalheResultado').textContent = '';
      return false;
    }

    const metrosQuadrados = comprimento * largura;
    const pesQuadrados = metrosQuadrados * 10.7639;

    document.getElementById('valorResultado').textContent = metrosQuadrados.toFixed(2) + ' m²';
    document.getElementById('detalheResultado').textContent = pesQuadrados.toFixed(2) + ' ft²';
    return false;
  }
  </script>
</body>
</html>
