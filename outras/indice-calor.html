<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Índice de Calor - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Índice de Calor</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Índice de Calor</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="temperatura">Temperatura (°F)</label>
          <input type="number" id="temperatura" step="0.1" required>
        </div>
        <div class="form-group">
          <label for="umidade">Umidade Relativa (%)</label>
          <input type="number" id="umidade" step="1" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const tf = val('temperatura');
    const rh = val('umidade');

    const hi = -42.379 + 2.04901523 * tf + 10.14333127 * rh - 0.22475541 * tf * rh
      - 0.00683783 * tf * tf - 0.05481717 * rh * rh + 0.00122874 * tf * tf * rh
      + 0.00085282 * tf * rh * rh - 0.00000199 * tf * tf * rh * rh;

    const hiC = (hi - 32) * 5/9;
    let alerta = '';
    if (hi < 80) alerta = 'Baixo';
    else if (hi < 91) alerta = 'Cuidado';
    else if (hi < 103) alerta = 'Grande Cuidado';
    else if (hi < 125) alerta = 'Perigo';
    else alerta = 'Perigo Extremo';

    document.getElementById('valorResultado').textContent = fmt(hi) + ' °F (' + fmt(hiC) + ' °C)';
    document.getElementById('detalheResultado').textContent = 'Nível de alerta: ' + alerta;
    document.getElementById('resultado').classList.add('show');
    return false;
  }
  </script>
</body>
</html>
