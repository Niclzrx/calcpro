<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Duração de Tempo - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Duração de Tempo</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Duração de Tempo</h1>
      <form onsubmit="return calcular()">
        <div class="form-row">
          <div class="form-group">
            <label for="dataInicio">Data/Hora Início</label>
            <input type="datetime-local" id="dataInicio" required>
          </div>
          <div class="form-group">
            <label for="dataFim">Data/Hora Fim</label>
            <input type="datetime-local" id="dataFim" required>
          </div>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const inicio = new Date(document.getElementById('dataInicio').value);
    const fim = new Date(document.getElementById('dataFim').value);

    if (fim <= inicio) {
      document.getElementById('valorResultado').textContent = 'Data fim deve ser posterior';
      document.getElementById('detalheResultado').textContent = '';
      document.getElementById('resultado').classList.add('show');
      return false;
    }

    const diffMs = fim - inicio;
    const dias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    const horas = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutos = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
    const segundos = Math.floor((diffMs % (1000 * 60)) / 1000);

    const totalHoras = Math.floor(diffMs / (1000 * 60 * 60));
    const totalMinutos = Math.floor(diffMs / (1000 * 60));

    document.getElementById('valorResultado').textContent =
      dias + ' dias, ' + horas + 'h ' + minutos + 'min ' + segundos + 's';
    document.getElementById('detalheResultado').textContent =
      'Total: ' + totalHoras + ' horas | ' + totalMinutos + ' minutos | ' + diffMs + ' milissegundos';
    document.getElementById('resultado').classList.add('show');
    return false;
  }
  </script>
</body>
</html>
