<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Potência do Motor - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Potência do Motor</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Potência do Motor</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="torque">Torque (Nm)</label>
          <input type="number" id="torque" step="0.01" min="0.01" placeholder="Ex: 200" required>
        </div>
        <div class="form-group">
          <label for="rpm">Rotação (RPM)</label>
          <input type="number" id="rpm" min="1" placeholder="Ex: 3000" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const torque = parseFloat(document.getElementById('torque').value);
    const rpm = parseFloat(document.getElementById('rpm').value);

    if (isNaN(torque) || isNaN(rpm) || torque <= 0 || rpm <= 0) {
      document.getElementById('valorResultado').textContent = 'Valores inválidos';
      document.getElementById('detalheResultado').textContent = '';
      return false;
    }

    const watts = (torque * rpm * 2 * Math.PI) / 60;
    const kw = watts / 1000;
    const hp = kw * 1.34102;
    const cv = kw * 1.35962;

    document.getElementById('valorResultado').textContent = hp.toFixed(2) + ' HP / ' + cv.toFixed(2) + ' CV';
    document.getElementById('detalheResultado').innerHTML =
      kw.toFixed(2) + ' kW<br>' +
      watts.toFixed(2) + ' W<br>' +
      'Fórmula: P = (τ × RPM × 2π) / 60';
    return false;
  }
  </script>
</body>
</html>
