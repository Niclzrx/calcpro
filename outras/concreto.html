<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Concreto - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Concreto</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Concreto</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="comprimento">Comprimento (m)</label>
          <input type="number" id="comprimento" min="0" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="largura">Largura (m)</label>
          <input type="number" id="largura" min="0" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="espessura">Espessura (m)</label>
          <input type="number" id="espessura" min="0" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="sacos">Sacos por m³ (padrão: 50)</label>
          <input type="number" id="sacos" min="1" step="1" value="50" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const comprimento = parseFloat(document.getElementById('comprimento').value);
    const largura = parseFloat(document.getElementById('largura').value);
    const espessura = parseFloat(document.getElementById('espessura').value);
    const sacosPorM3 = parseInt(document.getElementById('sacos').value);

    const volume = comprimento * largura * espessura;
    const volumeLitros = volume * 1000;
    const sacosNecessarios = Math.ceil(volume * sacosPorM3);

    document.getElementById('valorResultado').textContent = volume.toFixed(3) + ' m³';
    document.getElementById('detalheResultado').textContent =
      volumeLitros.toFixed(1) + ' litros | ' + sacosNecessarios + ' sacos de concreto';
    return false;
  }
  </script>
</body>
</html>
