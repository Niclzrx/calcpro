<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Horas - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Horas</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Horas</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="inicio">Horário de Início</label>
          <input type="time" id="inicio" required>
        </div>
        <div class="form-group">
          <label for="fim">Horário de Fim</label>
          <input type="time" id="fim" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const inicioStr = document.getElementById('inicio').value;
    const fimStr = document.getElementById('fim').value;

    const [ih, im] = inicioStr.split(':').map(Number);
    const [fh, fm] = fimStr.split(':').map(Number);

    let inicioMin = ih * 60 + im;
    let fimMin = fh * 60 + fm;

    if (fimMin <= inicioMin) {
      fimMin += 24 * 60;
    }

    const diffMin = fimMin - inicioMin;
    const horas = Math.floor(diffMin / 60);
    const minutos = diffMin % 60;

    document.getElementById('valorResultado').textContent = horas + ' hora(s) e ' + minutos + ' minuto(s)';
    document.getElementById('detalheResultado').textContent = 'Total: ' + diffMin + ' minutos';
    return false;
  }
  </script>
</body>
</html>
