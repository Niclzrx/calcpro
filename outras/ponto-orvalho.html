<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Ponto de Orvalho - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Outras</a> / Calculadora de Ponto de Orvalho</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Ponto de Orvalho</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="temperatura">Temperatura (°C)</label>
          <input type="number" id="temperatura" step="0.1" required>
        </div>
        <div class="form-group">
          <label for="umidade">Umidade Relativa (%)</label>
          <input type="number" id="umidade" step="1" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const temp = val('temperatura');
    const umidade = val('umidade');

    const a = 17.27;
    const b = 237.7;
    const alfa = (a * temp) / (b + temp) + Math.log(umidade / 100);
    const tdp = (b * alfa) / (a - alfa);

    document.getElementById('valorResultado').textContent = fmt(tdp) + ' °C';
    document.getElementById('detalheResultado').textContent =
      'Ponto de orvalho: ' + fmt(tdp) + ' °C (' + fmt(tdp * 9/5 + 32) + ' °F)';
    document.getElementById('resultado').classList.add('show');
    return false;
  }
  </script>
</body>
</html>
