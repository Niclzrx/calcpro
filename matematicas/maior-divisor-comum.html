<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDC - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Matemáticas</a> / MDC</div>
    </div>
    <div class="calc-card">
      <h1>Maior Divisor Comum (MDC)</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="num1">Primeiro número</label>
          <input type="number" id="num1" min="1" required>
        </div>
        <div class="form-group">
          <label for="num2">Segundo número</label>
          <input type="number" id="num2" min="1" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    let a = parseInt(document.getElementById('num1').value);
    let b = parseInt(document.getElementById('num2').value);
    if (isNaN(a) || isNaN(b) || a < 1 || b < 1) {
      document.getElementById('valorResultado').textContent = 'Insira dois números positivos';
      document.getElementById('detalheResultado').textContent = '';
      return false;
    }
    const originalA = a, originalB = b;
    const steps = [];
    while (b) {
      steps.push(`${a} = ${b} × ${Math.floor(a / b)} + ${a % b}`);
      [a, b] = [b, a % b];
    }
    document.getElementById('valorResultado').textContent = a;
    document.getElementById('detalheResultado').textContent =
      `MDC(${originalA}, ${originalB}) = ${a}\nPassos (Euclides):\n${steps.join('\n')}`;
    return false;
  }
  </script>
</body>
</html>
