<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Números Grandes - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Matemáticas</a> / Números Grandes</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Números Grandes</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="numero">Número</label>
          <input type="number" id="numero" step="any" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function toWords(n) {
    if (n === 0) return 'zero';
    const units = ['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','catorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
    const tens = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
    const hundreds = ['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
    const thousands = ['','mil','milhão','bilhão','trilhão','quatrilhão','quintilhão'];
    if (n < 20) return units[n];
    if (n < 100) return tens[Math.floor(n/10)] + (n%10 ? ' e ' + units[n%10] : '');
    if (n < 1000) return hundreds[Math.floor(n/100)] + (n%100 ? ' e ' + toWords(n%100) : '');
    let parts = [];
    let idx = 0;
    while (n > 0) {
      const chunk = n % 1000;
      if (chunk > 0) {
        let s = toWords(chunk);
        if (idx > 0) s += ' ' + thousands[idx];
        parts.unshift(s);
      }
      n = Math.floor(n / 1000);
      idx++;
    }
    return parts.join(', ');
  }
  function calcular() {
    const numero = parseFloat(document.getElementById('numero').value);
    if (isNaN(numero)) {
      document.getElementById('valorResultado').textContent = 'Valor inválido';
      document.getElementById('detalheResultado').textContent = '';
      return false;
    }
    const absNum = Math.abs(numero);
    const exp = absNum === 0 ? 0 : Math.floor(Math.log10(absNum));
    const engExp = Math.floor(exp / 3) * 3;
    const engCoeff = absNum / Math.pow(10, engExp);
    const sign = numero < 0 ? '-' : '';
    document.getElementById('valorResultado').textContent = numero.toLocaleString('pt-BR');
    const words = numero === 0 ? 'zero' : (sign + toWords(Math.floor(absNum)) +
      (absNum % 1 !== 0 ? ' vírgula ' + String(absNum).split('.')[1] : ''));
    document.getElementById('detalheResultado').textContent =
      `Científico: ${sign}${engCoeff.toFixed(3)} × 10^${exp}\n` +
      `Engenharia: ${sign}${engCoeff.toFixed(3)} × 10^${engExp}\n` +
      `Por extenso: ${words}`;
    return false;
  }
  </script>
</body>
</html>
