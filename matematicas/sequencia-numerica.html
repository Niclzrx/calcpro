<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Sequência Numérica - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Matemáticas</a> / Calculadora de Sequência Numérica</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Sequência Numérica</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="tipo">Tipo de Sequência</label>
          <select id="tipo">
            <option value="aritmetica">Aritmética</option>
            <option value="geometrica">Geométrica</option>
          </select>
        </div>
        <div class="form-group">
          <label for="primeiro">Primeiro Termo (a₁)</label>
          <input type="number" id="primeiro" step="any" placeholder="Ex: 2" required>
        </div>
        <div class="form-group">
          <label for="razao">Razão (d) ou Taxa (q)</label>
          <input type="number" id="razao" step="any" placeholder="Ex: 3" required>
        </div>
        <div class="form-group">
          <label for="termos">Número de Termos</label>
          <input type="number" id="termos" min="1" max="100" value="10" required>
        </div>
        <button type="submit" class="btn">Gerar Sequência</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const tipo = document.getElementById('tipo').value;
    const a1 = parseFloat(document.getElementById('primeiro').value);
    const r = parseFloat(document.getElementById('razao').value);
    const n = parseInt(document.getElementById('termos').value);

    if (isNaN(a1) || isNaN(r) || isNaN(n) || n < 1 || n > 100) {
      document.getElementById('valorResultado').textContent = 'Erro';
      document.getElementById('detalheResultado').textContent = 'Valores inválidos';
      return false;
    }

    const termos = [];
    for (let i = 0; i < n; i++) {
      if (tipo === 'aritmetica') {
        termos.push(a1 + i * r);
      } else {
        termos.push(a1 * Math.pow(r, i));
      }
    }

    const soma = termos.reduce((a, b) => a + b, 0);
    const tipoNome = tipo === 'aritmetica' ? 'Aritmética' : 'Geométrica';
    const propriedade = tipo === 'aritmetica' ? 'Razão (d)' : 'Razão (q)';
    const ultimo = termos[n - 1];

    document.getElementById('valorResultado').textContent = termos.join(', ');
    document.getElementById('detalheResultado').innerHTML =
      'Tipo: <strong>' + tipoNome + '</strong><br>' +
      propriedade + ': <strong>' + r + '</strong><br>' +
      'Quantidade de termos: <strong>' + n + '</strong><br>' +
      'Último termo (a<sub>' + n + '</sub>): <strong>' + ultimo + '</strong><br>' +
      'Soma dos termos (S<sub>' + n + '</sub>): <strong>' + soma.toFixed(4) + '</strong>';
    return false;
  }
  </script>
</body>
</html>
