<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Binária - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Matemáticas</a> / Calculadora Binária</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora Binária</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="decimal">Número Decimal</label>
          <input type="number" id="decimal" min="0" required placeholder="Ex: 42">
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>&copy; 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var n = parseInt(document.getElementById('decimal').value);
    if (isNaN(n) || n < 0) {
      alert('Por favor, insira um número decimal válido.');
      return false;
    }
    var bin = n.toString(2);
    var oct = n.toString(8);
    var hex = n.toString(16).toUpperCase();
    document.getElementById('valorResultado').textContent = bin;
    document.getElementById('detalheResultado').innerHTML =
      'Octal: ' + oct + '<br>Hexadecimal: ' + hex;
    document.getElementById('resultado').style.display = 'block';
    return false;
  }
  </script>
</body>
</html>
