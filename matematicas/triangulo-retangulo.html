<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Triângulo Retângulo - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Matemáticas</a> / Triângulo Retângulo</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Triângulo Retângulo</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="conhecidos">Lados Conhecidos</label>
          <select id="conhecidos" required>
            <option value="ab">Catetos a e b</option>
            <option value="ac">Cateto a e hipotenusa c</option>
            <option value="bc">Cateto b e hipotenusa c</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group" id="aGroup">
            <label for="a">a (cateto)</label>
            <input type="number" id="a" step="any" min="0.0001">
          </div>
          <div class="form-group" id="bGroup">
            <label for="b">b (cateto)</label>
            <input type="number" id="b" step="any" min="0.0001">
          </div>
        </div>
        <div class="form-group" id="cGroup" style="display:none;">
          <label for="c">c (hipotenusa)</label>
          <input type="number" id="c" step="any" min="0.0001">
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  document.getElementById('conhecidos').addEventListener('change', function() {
    const conhecidos = this.value;
    
    document.getElementById('aGroup').style.display = conhecidos === 'bc' ? 'none' : 'block';
    document.getElementById('bGroup').style.display = conhecidos === 'ac' ? 'none' : 'block';
    document.getElementById('cGroup').style.display = conhecidos === 'ab' ? 'none' : 'block';
  });
  
  function calcular() {
    const conhecidos = document.getElementById('conhecidos').value;
    let a, b, c, angA, angB;
    
    if (conhecidos === 'ab') {
      a = val('a');
      b = val('b');
      if (a <= 0 || b <= 0) {
        document.getElementById('valorResultado').textContent = 'Erro';
        document.getElementById('detalheResultado').textContent = 'Os catetos devem ser maiores que zero';
        document.getElementById('resultado').classList.add('show');
        return false;
      }
      c = Math.sqrt(a * a + b * b);
      angA = Math.atan(a / b) * (180 / Math.PI);
      angB = 90 - angA;
    } else if (conhecidos === 'ac') {
      a = val('a');
      c = val('c');
      if (a <= 0 || c <= 0) {
        document.getElementById('valorResultado').textContent = 'Erro';
        document.getElementById('detalheResultado').textContent = 'Valores devem ser maiores que zero';
        document.getElementById('resultado').classList.add('show');
        return false;
      }
      if (c <= a) {
        document.getElementById('valorResultado').textContent = 'Erro';
        document.getElementById('detalheResultado').textContent = 'A hipotenusa deve ser maior que o cateto';
        document.getElementById('resultado').classList.add('show');
        return false;
      }
      b = Math.sqrt(c * c - a * a);
      angA = Math.asin(a / c) * (180 / Math.PI);
      angB = 90 - angA;
    } else if (conhecidos === 'bc') {
      b = val('b');
      c = val('c');
      if (b <= 0 || c <= 0) {
        document.getElementById('valorResultado').textContent = 'Erro';
        document.getElementById('detalheResultado').textContent = 'Valores devem ser maiores que zero';
        document.getElementById('resultado').classList.add('show');
        return false;
      }
      if (c <= b) {
        document.getElementById('valorResultado').textContent = 'Erro';
        document.getElementById('detalheResultado').textContent = 'A hipotenusa deve ser maior que o cateto';
        document.getElementById('resultado').classList.add('show');
        return false;
      }
      a = Math.sqrt(c * c - b * b);
      angA = Math.acos(b / c) * (180 / Math.PI);
      angB = 90 - angA;
    }
    
    const area = (a * b) / 2;
    const perimetro = a + b + c;
    
    document.getElementById('valorResultado').textContent = `a = ${fmt(a, 4)} | b = ${fmt(b, 4)} | c = ${fmt(c, 4)}`;
    document.getElementById('detalheResultado').textContent = `Ângulos: A = ${fmt(angA, 2)}° | B = ${fmt(angB, 2)}° | Área = ${fmt(area, 4)} | Perímetro = ${fmt(perimetro, 4)}`;
    document.getElementById('resultado').classList.add('show');
    return false;
  }
  </script>
</body>
</html>
