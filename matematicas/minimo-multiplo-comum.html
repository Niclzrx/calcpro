<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMC - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Matemáticas</a> / MMC</div>
    </div>
    <div class="calc-card">
      <h1>Mínimo Múltiplo Comum (MMC)</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="numeros">Números separados por vírgula</label>
          <input type="text" id="numeros" placeholder="Ex: 4, 6, 8" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { [a, b] = [b, a % b]; }
    return a;
  }
  function lcm(a, b) {
    return Math.abs(a * b) / gcd(a, b);
  }
  function calcular() {
    const input = document.getElementById('numeros').value;
    const nums = input.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n) && n > 0);
    if (nums.length < 2) {
      document.getElementById('valorResultado').textContent = 'Insira pelo menos 2 números positivos';
      document.getElementById('detalheResultado').textContent = '';
      return false;
    }
    let resultado = nums[0];
    for (let i = 1; i < nums.length; i++) {
      resultado = lcm(resultado, nums[i]);
    }
    document.getElementById('valorResultado').textContent = resultado;
    document.getElementById('detalheResultado').textContent =
      `MMC(${nums.join(', ')}) = ${resultado}`;
    return false;
  }
  </script>
</body>
</html>
