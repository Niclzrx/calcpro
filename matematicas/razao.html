<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Razão - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Matemáticas</a> / Razão</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Razão</h1>
      <form onsubmit="return calcular()">
        <div class="form-row">
          <div class="form-group">
            <label for="a">Valor A</label>
            <input type="number" id="a" step="any" required>
          </div>
          <div class="form-group">
            <label for="b">Valor B</label>
            <input type="number" id="b" step="any" required>
          </div>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function mdc(a, b) {
    a = Math.abs(a);
    b = Math.abs(b);
    while (b) {
      [a, b] = [b, a % b];
    }
    return a;
  }
  
  function calcular() {
    const a = val('a');
    const b = val('b');
    
    if (a === 0 && b === 0) {
      document.getElementById('valorResultado').textContent = 'Erro';
      document.getElementById('detalheResultado').textContent = 'Ambos os valores não podem ser zero';
      document.getElementById('resultado').classList.add('show');
      return false;
    }
    
    if (b === 0) {
      document.getElementById('valorResultado').textContent = `${a} : ∞`;
      document.getElementById('detalheResultado').textContent = 'Razão com denominador zero';
      document.getElementById('resultado').classList.add('show');
      return false;
    }
    
    const divisor = mdc(a, b);
    const novoA = a / divisor;
    const novoB = b / divisor;
    
    document.getElementById('valorResultado').textContent = `${novoA} : ${novoB}`;
    document.getElementById('detalheResultado').textContent = `Original: ${a} : ${b} | Divisor comum: ${divisor}`;
    document.getElementById('resultado').classList.add('show');
    return false;
  }
  </script>
</body>
</html>
