<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Meia-Vida - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Matemáticas</a> / Calculadora de Meia-Vida</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Meia-Vida</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="inicial">Quantidade Inicial</label>
          <input type="number" id="inicial" step="any" min="0" required placeholder="Ex: 100">
        </div>
        <div class="form-group">
          <label for="meiavida">Tempo de Meia-Vida</label>
          <input type="number" id="meiavida" step="any" min="0.001" required placeholder="Ex: 5">
        </div>
        <div class="form-group">
          <label for="tempo">Tempo Decorrido</label>
          <input type="number" id="tempo" step="any" min="0" required placeholder="Ex: 15">
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>&copy; 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var inicial = parseFloat(document.getElementById('inicial').value);
    var meiavida = parseFloat(document.getElementById('meiavida').value);
    var tempo = parseFloat(document.getElementById('tempo').value);
    if (isNaN(inicial) || isNaN(meiavida) || isNaN(tempo) || meiavida <= 0) {
      alert('Por favor, insira valores válidos.');
      return false;
    }
    var restante = inicial * Math.pow(0.5, tempo / meiavida);
    var percentual = (restante / inicial) * 100;
    document.getElementById('valorResultado').textContent = fmt(restante);
    document.getElementById('detalheResultado').textContent =
      'Percentual restante: ' + fmtPercent(percentual);
    document.getElementById('resultado').style.display = 'block';
    return false;
  }
  </script>
</body>
</html>
