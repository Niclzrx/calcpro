<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Probabilidade - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Matemáticas</a> / Calculadora de Probabilidade</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Probabilidade</h1>
      <form onsubmit="return calcular()">
        <div class="form-row">
          <div class="form-group">
            <label for="favoraveis">Eventos Favoráveis</label>
            <input type="number" id="favoraveis" min="0" required placeholder="Ex: 3">
          </div>
          <div class="form-group">
            <label for="total">Total de Eventos</label>
            <input type="number" id="total" min="1" required placeholder="Ex: 10">
          </div>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>&copy; 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var fav = parseInt(document.getElementById('favoraveis').value);
    var total = parseInt(document.getElementById('total').value);
    if (isNaN(fav) || isNaN(total) || total <= 0 || fav < 0) {
      alert('Por favor, insira valores válidos.');
      return false;
    }
    if (fav > total) {
      alert('Eventos favoráveis não pode exceder o total.');
      return false;
    }
    var prob = fav / total;
    var percent = prob * 100;
    document.getElementById('valorResultado').textContent = 'P = ' + fmt(prob, 4);
    document.getElementById('detalheResultado').textContent =
      'Probabilidade: ' + fmtPercent(percent) +
      '\nOdds: ' + fav + ' : ' + (total - fav);
    document.getElementById('resultado').style.display = 'block';
    return false;
  }
  </script>
</body>
</html>
