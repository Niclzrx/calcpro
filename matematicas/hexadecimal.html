<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Hexadecimal - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Matemáticas</a> / Calculadora Hexadecimal</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora Hexadecimal</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="modo">Modo de Conversão</label>
          <select id="modo">
            <option value="dec2hex">Decimal → Hexadecimal</option>
            <option value="hex2dec">Hexadecimal → Decimal</option>
          </select>
        </div>
        <div class="form-group" id="grupo-decimal">
          <label for="decimal">Número Decimal</label>
          <input type="number" id="decimal" min="0" placeholder="Ex: 255">
        </div>
        <div class="form-group" id="grupo-hex" style="display:none">
          <label for="hex">Número Hexadecimal</label>
          <input type="text" id="hex" placeholder="Ex: FF" style="text-transform:uppercase">
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>&copy; 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  document.getElementById('modo').addEventListener('change', function() {
    var dec = document.getElementById('grupo-decimal');
    var hx = document.getElementById('grupo-hex');
    if (this.value === 'dec2hex') {
      dec.style.display = '';
      hx.style.display = 'none';
    } else {
      dec.style.display = 'none';
      hx.style.display = '';
    }
  });

  function calcular() {
    var modo = document.getElementById('modo').value;
    var resultado, detalhe;
    if (modo === 'dec2hex') {
      var n = parseInt(document.getElementById('decimal').value);
      if (isNaN(n) || n < 0) {
        alert('Por favor, insira um número decimal válido.');
        return false;
      }
      resultado = n.toString(16).toUpperCase();
      detalhe = 'Binário: ' + n.toString(2) + '\nOctal: ' + n.toString(8);
    } else {
      var h = document.getElementById('hex').value.trim();
      if (!/^[0-9A-Fa-f]+$/.test(h)) {
        alert('Por favor, insira um número hexadecimal válido.');
        return false;
      }
      var n = parseInt(h, 16);
      resultado = n;
      detalhe = 'Binário: ' + n.toString(2) + '\nOctal: ' + n.toString(8);
    }
    document.getElementById('valorResultado').textContent = resultado;
    document.getElementById('detalheResultado').textContent = detalhe;
    document.getElementById('resultado').style.display = 'block';
    return false;
  }
  </script>
</body>
</html>
