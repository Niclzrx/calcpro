<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora da Fórmula Quadrática - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Matemáticas</a> / Calculadora da Fórmula Quadrática</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora da Fórmula Quadrática</h1>
      <p style="color:var(--text-light);margin-bottom:20px">Para ax² + bx + c = 0</p>
      <form onsubmit="return calcular()">
        <div class="form-row">
          <div class="form-group">
            <label for="a">a</label>
            <input type="number" id="a" step="any" required placeholder="Ex: 1">
          </div>
          <div class="form-group">
            <label for="b">b</label>
            <input type="number" id="b" step="any" required placeholder="Ex: -3">
          </div>
        </div>
        <div class="form-group">
          <label for="c">c</label>
          <input type="number" id="c" step="any" required placeholder="Ex: 2">
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>&copy; 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var a = parseFloat(document.getElementById('a').value);
    var b = parseFloat(document.getElementById('b').value);
    var c = parseFloat(document.getElementById('c').value);
    if (isNaN(a) || isNaN(b) || isNaN(c) || a === 0) {
      alert('Por favor, insira valores válidos (a não pode ser zero).');
      return false;
    }
    var disc = b * b - 4 * a * c;
    var resultado, detalhe;
    if (disc > 0) {
      var x1 = (-b + Math.sqrt(disc)) / (2 * a);
      var x2 = (-b - Math.sqrt(disc)) / (2 * a);
      resultado = 'Duas raízes reais';
      detalhe = 'x₁ = ' + fmt(x1) + '\nx₂ = ' + fmt(x2) + '\nΔ = ' + fmt(disc);
    } else if (disc === 0) {
      var x = -b / (2 * a);
      resultado = 'Uma raiz real (dupla)';
      detalhe = 'x = ' + fmt(x) + '\nΔ = 0';
    } else {
      var real = -b / (2 * a);
      var imag = Math.sqrt(-disc) / (2 * a);
      resultado = 'Raízes complexas';
      detalhe = 'x₁ = ' + fmt(real) + ' + ' + fmt(imag) + 'i\nx₂ = ' + fmt(real) + ' - ' + fmt(imag) + 'i\nΔ = ' + fmt(disc);
    }
    document.getElementById('valorResultado').textContent = resultado;
    document.getElementById('detalheResultado').textContent = detalhe;
    document.getElementById('resultado').style.display = 'block';
    return false;
  }
  </script>
</body>
</html>
