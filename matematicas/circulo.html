<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Círculo - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Matemáticas</a> / Círculo</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Círculo</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="raio">Raio (r)</label>
          <input type="number" id="raio" step="any" min="0.0001" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const r = val('raio');
    
    if (r <= 0) {
      document.getElementById('valorResultado').textContent = 'Erro';
      document.getElementById('detalheResultado').textContent = 'Raio deve ser maior que zero';
      document.getElementById('resultado').classList.add('show');
      return false;
    }
    
    const area = Math.PI * r * r;
    const circunferencia = 2 * Math.PI * r;
    const diametro = 2 * r;
    
    document.getElementById('valorResultado').textContent = `Área: ${fmt(area, 4)}`;
    document.getElementById('detalheResultado').textContent = `Circunferência: ${fmt(circunferencia, 4)} | Diâmetro: ${fmt(diametro, 4)}`;
    document.getElementById('resultado').classList.add('show');
    return false;
  }
  </script>
</body>
</html>
