<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Frações - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Matemáticas</a> / Calculadora de Frações</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Frações</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label>Primeira Fração</label>
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="number" id="num1" placeholder="Numerador" required>
            <span style="font-size:1.5rem;">/</span>
            <input type="number" id="den1" placeholder="Denominador" required>
          </div>
        </div>
        <div class="form-group">
          <label for="operacao">Operação</label>
          <select id="operacao">
            <option value="+">Adição (+)</option>
            <option value="-">Subtração (-)</option>
            <option value="*">Multiplicação (×)</option>
            <option value="/">Divisão (÷)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Segunda Fração</label>
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="number" id="num2" placeholder="Numerador" required>
            <span style="font-size:1.5rem;">/</span>
            <input type="number" id="den2" placeholder="Denominador" required>
          </div>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function mdc(a, b) {
    a = Math.abs(a);
    b = Math.abs(b);
    while (b) { [a, b] = [b, a % b]; }
    return a;
  }

  function simplificar(num, den) {
    if (den === 0) return { num, den };
    const sinal = (den < 0) ? -1 : 1;
    const div = mdc(Math.abs(num), Math.abs(den));
    return { num: sinal * (num / div), den: sinal * (den / div) };
  }

  function calcular() {
    const n1 = parseInt(document.getElementById('num1').value);
    const d1 = parseInt(document.getElementById('den1').value);
    const op = document.getElementById('operacao').value;
    const n2 = parseInt(document.getElementById('num2').value);
    const d2 = parseInt(document.getElementById('den2').value);

    if (d1 === 0 || d2 === 0) {
      document.getElementById('valorResultado').textContent = 'Erro';
      document.getElementById('detalheResultado').textContent = 'Denominador não pode ser zero';
      return false;
    }

    let resNum, resDen;
    switch (op) {
      case '+': resNum = n1 * d2 + n2 * d1; resDen = d1 * d2; break;
      case '-': resNum = n1 * d2 - n2 * d1; resDen = d1 * d2; break;
      case '*': resNum = n1 * n2; resDen = d1 * d2; break;
      case '/': resNum = n1 * d2; resDen = d1 * n2; break;
    }

    if (resDen === 0) {
      document.getElementById('valorResultado').textContent = 'Erro';
      document.getElementById('detalheResultado').textContent = 'Divisão por zero';
      return false;
    }

    const simpl = simplificar(resNum, resDen);
    const opSimbol = { '+': '+', '-': '-', '*': '×', '/': '÷' }[op];
    document.getElementById('valorResultado').textContent = simpl.num + ' / ' + simpl.den;
    document.getElementById('detalheResultado').textContent =
      n1 + '/' + d1 + ' ' + opSimbol + ' ' + n2 + '/' + d2 + ' = ' + simpl.num + '/' + simpl.den;
    return false;
  }
  </script>
</body>
</html>
