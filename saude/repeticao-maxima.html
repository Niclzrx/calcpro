<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Repetição Máxima - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Saúde</a> / Calculadora de Repetição Máxima</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Repetição Máxima (1RM)</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="peso">Peso Levantado (kg)</label>
          <input type="number" id="peso" step="0.1" min="1" required placeholder="Ex: 80">
        </div>
        <div class="form-group">
          <label for="repeticoes">Número de Repetições</label>
          <input type="number" id="repeticoes" step="1" min="1" max="30" required placeholder="Ex: 10">
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var peso = parseFloat(document.getElementById('peso').value);
    var rep = parseInt(document.getElementById('repeticoes').value);

    var rm = peso * (1 + rep / 30);

    document.getElementById('valorResultado').innerHTML = 'Repetição Máxima (1RM): <strong>' + rm.toFixed(1) + ' kg</strong>';
    document.getElementById('detalheResultado').textContent = 'Fórmula de Epley: ' + peso + ' × (1 + ' + rep + '/30)';
    return false;
  }
  </script>
</body>
</html>
