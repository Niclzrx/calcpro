<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de TMB - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Saúde</a> / Calculadora de TMB</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de TMB (Taxa Metabólica Basal)</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="peso">Peso (kg)</label>
          <input type="number" id="peso" step="0.1" min="1" required>
        </div>
        <div class="form-group">
          <label for="altura">Altura (cm)</label>
          <input type="number" id="altura" step="0.1" min="1" required>
        </div>
        <div class="form-group">
          <label for="idade">Idade (anos)</label>
          <input type="number" id="idade" min="1" max="120" required>
        </div>
        <div class="form-group">
          <label for="sexo">Sexo</label>
          <select id="sexo" required>
            <option value="M">Masculino</option>
            <option value="F">Feminino</option>
          </select>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>&copy; 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var peso = parseFloat(document.getElementById('peso').value);
    var altura = parseFloat(document.getElementById('altura').value);
    var idade = parseInt(document.getElementById('idade').value);
    var sexo = document.getElementById('sexo').value;

    if (isNaN(peso) || isNaN(altura) || isNaN(idade) || peso <= 0 || altura <= 0 || idade <= 0) {
      alert('Por favor, insira valores válidos.');
      return false;
    }

    var tmb;
    if (sexo === 'M') {
      tmb = 10 * peso + 6.25 * altura - 5 * idade + 5;
    } else {
      tmb = 10 * peso + 6.25 * altura - 5 * idade - 161;
    }

    document.getElementById('valorResultado').textContent = tmb.toFixed(0) + ' kcal/dia';
    document.getElementById('detalheResultado').textContent =
      'Esta é a quantidade de calorias que seu corpo queima em repouso completo.';
    document.getElementById('resultado').style.display = 'block';
    return false;
  }
  </script>
</body>
</html>
