<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de BAC - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Saúde</a> / Calculadora de BAC</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de BAC (Teor de Álcool no Sangue)</h1>
      <form onsubmit="return calcular()">
        <div class="form-row">
          <div class="form-group">
            <label for="sexo">Sexo</label>
            <select id="sexo">
              <option value="m">Masculino</option>
              <option value="f">Feminino</option>
            </select>
          </div>
          <div class="form-group">
            <label for="peso">Peso (kg)</label>
            <input type="number" id="peso" step="0.1" min="1" required>
          </div>
        </div>
        <div class="form-group">
          <label for="bebidas">Número de Bebidas Alcoólicas (330ml cerveja 5%)</label>
          <select id="bebidas">
            <option value="1">1 bebida</option>
            <option value="2">2 bebidas</option>
            <option value="3">3 bebidas</option>
            <option value="4">4 bebidas</option>
            <option value="5">5 bebidas</option>
            <option value="6">6 bebidas</option>
            <option value="7">7 bebidas</option>
            <option value="8">8 bebidas</option>
            <option value="9">9 bebidas</option>
            <option value="10">10 bebidas</option>
          </select>
        </div>
        <div class="form-group">
          <label for="horas">Horas desde a Primeira Bebida</label>
          <input type="number" id="horas" step="0.25" min="0" max="24" value="1" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const sexo = document.getElementById('sexo').value;
    const peso = val('peso');
    const bebidas = val('bebidas');
    const horas = val('horas');

    if (peso <= 0 || bebidas <= 0 || horas < 0) {
      alert('Por favor, preencha todos os campos corretamente.');
      return false;
    }

    const volumeBebida = 330;
    const teorAlcool = 0.05;
    const mlAlcool = bebidas * volumeBebida * teorAlcool;
    const gramasAlcool = mlAlcool * 0.789;
    const r = sexo === 'm' ? 0.68 : 0.55;

    const bac = (gramasAlcool / (peso * 1000 * r)) * 100 - (0.015 * horas);
    const bacFinal = Math.max(bac, 0);

    let classificacao, risco;
    if (bacFinal < 0.02) {
      classificacao = 'Inferior ao limite legal';
      risco = 'Nenhum efeito perceptível';
    } else if (bacFinal < 0.05) {
      classificacao = 'Levemente acima do limite legal';
      risco = 'Euforizado, relaxamento, diminuição da inibição';
    } else if (bacFinal < 0.08) {
      classificacao = 'Acima do limite legal (0,05%)';
      risco = 'Coordenação prejudicada, equilíbrio reduzido';
    } else if (bacFinal < 0.15) {
      classificacao = 'Muito acima do limite legal';
      risco = 'Sonolência, coordenação severamente prejudicada';
    } else if (bacFinal < 0.30) {
      classificacao = 'Nível perigoso';
      risco = 'Confusão mental, desorientação, vômito';
    } else {
      classificacao = 'Nível potencialmente letal';
      risco = ' inconsciência, insuficiência respiratória, coma';
    }

    document.getElementById('valorResultado').textContent = fmtPercent(bacFinal);
    document.getElementById('detalheResultado').innerHTML =
      'Classificação: ' + classificacao + '<br>' +
      'Efeitos: ' + risco + '<br>' +
      'Limite legal no Brasil: 0,05% (0,2mg/L)<br>' +
      'Bebidas: ' + bebidas + ' × 330ml | Peso: ' + fmt(peso, 1) + ' kg | Tempo: ' + fmt(horas, 1) + 'h';

    showResult('resultado');
    return false;
  }
  </script>
</body>
</html>
