<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Proteínas - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Saúde</a> / Calculadora de Proteínas</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Proteínas</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="peso">Peso (kg)</label>
          <input type="number" id="peso" step="0.1" min="1" required placeholder="Ex: 70">
        </div>
        <div class="form-group">
          <label for="atividade">Nível de Atividade</label>
          <select id="atividade" required>
            <option value="0.8">Sedentário (0.8 g/kg)</option>
            <option value="1.0">Atividade Leve (1.0 g/kg)</option>
            <option value="1.4" selected>Atividade Moderada (1.4 g/kg)</option>
            <option value="1.8">Atividade Intensa (1.8 g/kg)</option>
          </select>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var peso = parseFloat(document.getElementById('peso').value);
    var gPorKg = parseFloat(document.getElementById('atividade').value);

    var proteinaGramas = peso * gPorKg;
    var proteinaCalorias = proteinaGramas * 4;
    var porRefeicao = proteinaGramas / 4;

    document.getElementById('valorResultado').innerHTML = 'Proteínas Recomendadas: <strong>' + proteinaGramas.toFixed(0) + ' g/dia</strong>';
    document.getElementById('detalheResultado').textContent = 'Equivalente a ' + proteinaCalorias + ' kcal/dia | ~' + porRefeicao.toFixed(0) + ' g por refeição (4 refeições)';
    return false;
  }
  </script>
</body>
</html>
