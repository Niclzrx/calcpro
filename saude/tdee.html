<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora TDEE - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Saúde</a> / Calculadora TDEE</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora TDEE</h1>
      <form onsubmit="return calcular()">
        <div class="form-row">
          <div class="form-group">
            <label for="peso">Peso (kg)</label>
            <input type="number" id="peso" step="0.1" min="1" required>
          </div>
          <div class="form-group">
            <label for="altura">Altura (cm)</label>
            <input type="number" id="altura" step="0.1" min="1" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="idade">Idade (anos)</label>
            <input type="number" id="idade" min="1" max="120" required>
          </div>
          <div class="form-group">
            <label for="sexo">Sexo</label>
            <select id="sexo">
              <option value="m">Masculino</option>
              <option value="f">Feminino</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="atividade">Nível de Atividade</label>
          <select id="atividade">
            <option value="1.2">Sedentário (pouco ou nenhum exercício)</option>
            <option value="1.375">Levemente ativo (exercício leve 1-3 dias/semana)</option>
            <option value="1.55">Moderadamente ativo (exercício moderado 3-5 dias/semana)</option>
            <option value="1.725">Muito ativo (exercício intenso 6-7 dias/semana)</option>
            <option value="1.9">Extremamente ativo (exercício muito intenso, trabalho físico)</option>
          </select>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const peso = val('peso');
    const altura = val('altura');
    const idade = val('idade');
    const sexo = document.getElementById('sexo').value;
    const atividade = parseFloat(document.getElementById('atividade').value);

    if (peso <= 0 || altura <= 0 || idade <= 0) {
      alert('Por favor, preencha todos os campos com valores válidos.');
      return false;
    }

    let tmb;
    if (sexo === 'm') {
      tmb = 10 * peso + 6.25 * altura - 5 * idade + 5;
    } else {
      tmb = 10 * peso + 6.25 * altura - 5 * idade - 161;
    }

    const tdee = tmb * atividade;

    document.getElementById('valorResultado').textContent = fmt(tdee, 0) + ' kcal/dia';
    document.getElementById('detalheResultado').innerHTML =
      'Taxa Metabólica Basal (TMB): ' + fmt(tmb, 0) + ' kcal<br>' +
      'Nível de atividade: ' + atividade + 'x<br>' +
      'TDEE = TMB × Fator de atividade';

    showResult('resultado');
    return false;
  }
  </script>
</body>
</html>
