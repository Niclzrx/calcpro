<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pontos Weight Watchers - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Saúde</a> / Pontos Weight Watchers</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Pontos Weight Watchers</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="calorias">Calorias (kcal)</label>
          <input type="number" id="calorias" step="1" min="0" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="gordura">Gordura (g)</label>
            <input type="number" id="gordura" step="0.1" min="0" required>
          </div>
          <div class="form-group">
            <label for="proteina">Proteína (g)</label>
            <input type="number" id="proteina" step="0.1" min="0" required>
          </div>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const calorias = val('calorias');
    const gordura = val('gordura');
    const proteina = val('proteina');

    if (calorias < 0 || gordura < 0 || proteina < 0) {
      alert('Por favor, preencha todos os campos com valores válidos.');
      return false;
    }

    const pontos = Math.max(0, Math.round((calorias / 50) + (gordura / 12) - Math.min(proteina / 10, 4)));

    let faixa;
    if (pontos <= 3) {
      faixa = 'Alimento leve';
    } else if (pontos <= 7) {
      faixa = 'Alimento moderado';
    } else if (pontos <= 12) {
      faixa = 'Alimento calórico';
    } else {
      faixa = 'Alimento muito calórico';
    }

    document.getElementById('valorResultado').textContent = pontos + ' pontos';
    document.getElementById('detalheResultado').innerHTML =
      'Faixa: ' + faixa + '<br>' +
      'Cálculo: (Calorias/50) + (Gordura/12) - min(Proteína/10, 4)<br>' +
      'Calorias: ' + fmt(calorias, 0) + ' kcal | Gordura: ' + fmt(gordura, 1) + 'g | Proteína: ' + fmt(proteina, 1) + 'g';

    showResult('resultado');
    return false;
  }
  </script>
</body>
</html>
