<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Gordura Corporal do Exército - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Saúde</a> / Calculadora de Gordura Corporal do Exército</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Gordura Corporal do Exército</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="peso">Peso (kg)</label>
          <input type="number" id="peso" step="0.1" min="1" required placeholder="Ex: 70">
        </div>
        <div class="form-group">
          <label for="altura">Altura (cm)</label>
          <input type="number" id="altura" step="0.1" min="1" required placeholder="Ex: 175">
        </div>
        <div class="form-group">
          <label for="pescoco">Pescoço (cm)</label>
          <input type="number" id="pescoco" step="0.1" min="1" required placeholder="Ex: 38">
        </div>
        <div class="form-group">
          <label for="cintura">Cintura (cm)</label>
          <input type="number" id="cintura" step="0.1" min="1" required placeholder="Ex: 80">
        </div>
        <div class="form-group">
          <label for="sexo">Sexo</label>
          <select id="sexo" required>
            <option value="M">Masculino</option>
            <option value="F">Feminino</option>
          </select>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var peso = parseFloat(document.getElementById('peso').value);
    var altura = parseFloat(document.getElementById('altura').value);
    var pescoco = parseFloat(document.getElementById('pescoco').value);
    var cintura = parseFloat(document.getElementById('cintura').value);
    var sexo = document.getElementById('sexo').value;

    var gordura;
    if (sexo === 'M') {
      gordura = 86.010 * Math.log10(cintura - pescoco) - 70.041 * Math.log10(altura) + 36.76;
    } else {
      gordura = 163.205 * Math.log10(cintura + pescoco - 3.333) - 97.684 * Math.log10(altura) - 78.387;
    }

    gordura = Math.max(0, Math.min(gordura, 60));

    var massaGorda = peso * gordura / 100;
    var massaMagra = peso - massaGorda;

    document.getElementById('valorResultado').innerHTML = 'Gordura Corporal: <strong>' + gordura.toFixed(1) + '%</strong>';
    document.getElementById('detalheResultado').textContent = 'Massa gorda: ' + massaGorda.toFixed(1) + ' kg | Massa magra: ' + massaMagra.toFixed(1) + ' kg';
    return false;
  }
  </script>
</body>
</html>
