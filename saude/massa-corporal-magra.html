<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Massa Corporal Magra - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Saúde</a> / Calculadora de Massa Corporal Magra</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Massa Corporal Magra</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="peso">Peso (kg)</label>
          <input type="number" id="peso" step="0.1" min="1" required placeholder="Ex: 70">
        </div>
        <div class="form-group">
          <label for="gordura">Percentual de Gordura (%)</label>
          <input type="number" id="gordura" step="0.1" min="0" max="100" required placeholder="Ex: 20">
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var peso = parseFloat(document.getElementById('peso').value);
    var gordura = parseFloat(document.getElementById('gordura').value);

    var massaMagra = peso * (1 - gordura / 100);
    var massaGorda = peso * gordura / 100;

    document.getElementById('valorResultado').innerHTML = 'Massa Corporal Magra: <strong>' + massaMagra.toFixed(1) + ' kg</strong>';
    document.getElementById('detalheResultado').textContent = 'Massa gorda: ' + massaGorda.toFixed(1) + ' kg (' + gordura + '% do peso total)';
    return false;
  }
  </script>
</body>
</html>
