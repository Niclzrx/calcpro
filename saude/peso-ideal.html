<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Peso Ideal - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Saúde</a> / Calculadora de Peso Ideal</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Peso Ideal</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="altura">Altura (cm)</label>
          <input type="number" id="altura" step="0.1" min="1" required>
        </div>
        <div class="form-group">
          <label for="sexo">Sexo</label>
          <select id="sexo" required>
            <option value="M">Masculino</option>
            <option value="F">Feminino</option>
          </select>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>&copy; 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var altura = parseFloat(document.getElementById('altura').value);
    var sexo = document.getElementById('sexo').value;

    if (isNaN(altura) || altura <= 0) {
      alert('Por favor, insira uma altura válida.');
      return false;
    }

    var alturaPolegadas = altura / 2.54;
    var pesoIdeal;

    if (sexo === 'M') {
      pesoIdeal = 50 + 2.3 * (alturaPolegadas - 60);
    } else {
      pesoIdeal = 45.5 + 2.3 * (alturaPolegadas - 60);
    }

    if (pesoIdeal < 0) pesoIdeal = 0;

    document.getElementById('valorResultado').textContent = pesoIdeal.toFixed(1) + ' kg';
    document.getElementById('detalheResultado').textContent =
      'Fórmula de Devine: ' + (sexo === 'M' ? 'Homens' : 'Mulheres') + ' - ' +
      altura.toFixed(0) + ' cm = ' + pesoIdeal.toFixed(1) + ' kg';
    document.getElementById('resultado').style.display = 'block';
    return false;
  }
  </script>
</body>
</html>
