<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Ovulação - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Saúde</a> / Calculadora de Ovulação</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Ovulação</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="dataUltima">Data da Última Menstruação</label>
          <input type="date" id="dataUltima" required>
        </div>
        <div class="form-group">
          <label for="ciclo">Duração do Ciclo (dias)</label>
          <input type="number" id="ciclo" value="28" min="20" max="45" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const dataStr = document.getElementById('dataUltima').value;
    const ciclo = val('ciclo');

    if (!dataStr || ciclo < 20 || ciclo > 45) {
      alert('Por favor, preencha todos os campos corretamente.');
      return false;
    }

    const dataUltima = new Date(dataStr + 'T00:00:00');
    const diaOvulacao = ciclo - 14;

    const dataOvulacao = new Date(dataUltima);
    dataOvulacao.setDate(dataOvulacao.getDate() + diaOvulacao);

    const inicioFertil = new Date(dataUltima);
    inicioFertil.setDate(inicioFertil.getDate() + diaOvulacao - 5);

    const fimFertil = new Date(dataUltima);
    fimFertil.setDate(fimFertil.getDate() + diaOvulacao + 1);

    const formatar = (d) => d.toLocaleDateString('pt-BR');

    document.getElementById('valorResultado').textContent = 'Dia da ovulação: ' + formatar(dataOvulacao);
    document.getElementById('detalheResultado').innerHTML =
      'Dia provável da ovulação: ' + diaOvulacao + 'º dia do ciclo<br>' +
      'Janela fértil: ' + formatar(inicioFertil) + ' a ' + formatar(fimFertil) + '<br>' +
      'Duração do ciclo: ' + ciclo + ' dias';

    showResult('resultado');
    return false;
  }
  </script>
</body>
</html>
