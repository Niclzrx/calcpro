<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de TFG - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Saúde</a> / Calculadora de TFG</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de TFG (Taxa de Filtração Glomerular)</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="creatinina">Creatinina Sérica (mg/dL)</label>
          <input type="number" id="creatinina" step="0.01" min="0.1" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="idade">Idade (anos)</label>
            <input type="number" id="idade" min="1" max="120" required>
          </div>
          <div class="form-group">
            <label for="sexo">Sexo</label>
            <select id="sexo">
              <option value="m">Masculino</option>
              <option value="f">Feminino</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="raca">Raça</label>
          <select id="raca">
            <option value="0">Não-negro</option>
            <option value="1">Negro</option>
          </select>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const creatinina = val('creatinina');
    const idade = val('idade');
    const sexo = document.getElementById('sexo').value;
    const raca = parseInt(document.getElementById('raca').value);

    if (creatinina <= 0 || idade <= 0) {
      alert('Por favor, preencha todos os campos com valores válidos.');
      return false;
    }

    const kappa = sexo === 'f' ? 0.7 : 0.9;
    const alpha = sexo === 'f' ? -0.329 : -0.411;
    const minCrKappa = Math.min(creatinina / kappa, 1);
    const maxCrKappa = Math.max(creatinina / kappa, 1);

    let gfr = 141 * Math.pow(minCrKappa, alpha) * Math.pow(maxCrKappa, -1.209) * Math.pow(0.993, idade) * (raca === 1 ? 1.159 : 1);

    let classificacao;
    if (gfr >= 90) {
      classificacao = 'Normal (TFG ≥ 90 mL/min/1,73m²)';
    } else if (gfr >= 60) {
      classificacao = 'Levemente reduzida (TFG 60-89 mL/min/1,73m²)';
    } else if (gfr >= 45) {
      classificacao = 'Reduzida (TFG 45-59 mL/min/1,73m²)';
    } else if (gfr >= 30) {
      classificacao = 'Moderadamente reduzida (TFG 30-44 mL/min/1,73m²)';
    } else if (gfr >= 15) {
      classificacao = 'Gravemente reduzida (TFG 15-29 mL/min/1,73m²)';
    } else {
      classificacao = 'Falência renal (TFG < 15 mL/min/1,73m²)';
    }

    document.getElementById('valorResultado').textContent = fmt(gfr, 1) + ' mL/min/1,73m²';
    document.getElementById('detalheResultado').innerHTML =
      'Classificação: ' + classificacao + '<br>' +
      'Fórmula: CKD-EPI (2021)<br>' +
      'Creatinina: ' + fmt(creatinina) + ' mg/dL | Idade: ' + idade + ' anos';

    showResult('resultado');
    return false;
  }
  </script>
</body>
</html>
