<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Ganho de Peso na Gravidez - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Saúde</a> / Calculadora de Ganho de Peso na Gravidez</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Ganho de Peso na Gravidez</h1>
      <form onsubmit="return calcular()">
        <div class="form-group">
          <label for="pesoAntes">Peso antes da gravidez (kg)</label>
          <input type="number" id="pesoAntes" step="0.1" min="1" required>
        </div>
        <div class="form-group">
          <label for="imcAntes">IMC antes da gravidez</label>
          <input type="number" id="imcAntes" step="0.1" min="1" required>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>&copy; 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    var pesoAntes = parseFloat(document.getElementById('pesoAntes').value);
    var imcAntes = parseFloat(document.getElementById('imcAntes').value);

    if (isNaN(pesoAntes) || isNaN(imcAntes) || pesoAntes <= 0 || imcAntes <= 0) {
      alert('Por favor, insira valores válidos.');
      return false;
    }

    var ganhoMin = 0;
    var ganhoMax = 0;
    var classificacao = '';

    if (imcAntes < 18.5) {
      classificacao = 'Abaixo do peso (IMC < 18.5)';
      ganhoMin = 12.5;
      ganhoMax = 18;
    } else if (imcAntes < 25) {
      classificacao = 'Peso normal (IMC 18.5 - 24.9)';
      ganhoMin = 11.5;
      ganhoMax = 16;
    } else if (imcAntes < 30) {
      classificacao = 'Sobrepeso (IMC 25 - 29.9)';
      ganhoMin = 7;
      ganhoMax = 11.5;
    } else {
      classificacao = 'Obesidade (IMC >= 30)';
      ganhoMin = 5;
      ganhoMax = 9;
    }

    var pesoMin = pesoAntes + ganhoMin;
    var pesoMax = pesoAntes + ganhoMax;

    document.getElementById('valorResultado').textContent = ganhoMin + ' - ' + ganhoMax + ' kg';
    document.getElementById('detalheResultado').innerHTML =
      'Classificação: ' + classificacao + '<br>' +
      'Faixa de ganho recomendada: ' + ganhoMin + ' a ' + ganhoMax + ' kg<br>' +
      'Peso esperado no final: ' + pesoMin.toFixed(1) + ' a ' + pesoMax.toFixed(1) + ' kg';
    document.getElementById('resultado').style.display = 'block';
    return false;
  }
  </script>
</body>
</html>
