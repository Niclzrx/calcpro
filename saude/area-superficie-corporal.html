<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Área da Superfície Corporal - CalcPro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="../index.html" class="logo">CalcPro</a>
    </div>
  </header>
  <div class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="../index.html">Início</a> / <a href="index.html">Saúde</a> / Área da Superfície Corporal</div>
    </div>
    <div class="calc-card">
      <h1>Calculadora de Área da Superfície Corporal (BSA)</h1>
      <form onsubmit="return calcular()">
        <div class="form-row">
          <div class="form-group">
            <label for="peso">Peso (kg)</label>
            <input type="number" id="peso" step="0.1" min="1" required>
          </div>
          <div class="form-group">
            <label for="altura">Altura (cm)</label>
            <input type="number" id="altura" step="0.1" min="1" required>
          </div>
        </div>
        <button type="submit" class="btn">Calcular</button>
      </form>
      <div class="result" id="resultado">
        <h3>Resultado</h3>
        <div class="value" id="valorResultado"></div>
        <div class="detail" id="detalheResultado"></div>
      </div>
    </div>
  </div>
  <footer><div class="container"><p>© 2026 CalcPro</p></div></footer>
  <script src="../js/utils.js"></script>
  <script>
  function calcular() {
    const peso = val('peso');
    const altura = val('altura');

    if (peso <= 0 || altura <= 0) {
      alert('Por favor, preencha todos os campos com valores válidos.');
      return false;
    }

    const bsa = Math.sqrt((altura * peso) / 3600);

    let faixa;
    if (bsa < 1.6) {
      faixa = 'Área corporal pequena';
    } else if (bsa < 1.9) {
      faixa = 'Área corporal média';
    } else if (bsa < 2.2) {
      faixa = 'Área corporal média-alta';
    } else {
      faixa = 'Área corporal grande';
    }

    document.getElementById('valorResultado').textContent = fmt(bsa, 2) + ' m²';
    document.getElementById('detalheResultado').innerHTML =
      'Fórmula de Mosteller: BSA = √((altura × peso) / 3600)<br>' +
      'Faixa: ' + faixa + '<br>' +
      'Peso: ' + fmt(peso, 1) + ' kg | Altura: ' + fmt(altura, 1) + ' cm';

    showResult('resultado');
    return false;
  }
  </script>
</body>
</html>
